  if (!pack) {
    const available = Object.entries(TEMPLATE_PACKS).filter(([k, p]) => (p[listKey] || []).length);
    body = `
      <p class="modal-title">${isTask ? 'Plantillas de recordatorios' : 'Plantillas de pagos'}</p>
      <p class="sub" style="margin-bottom:14px;">${isTask
        ? 'Cosas que tienes que hacer. Elige un pack y después cambias nombres y fechas como quieras.'
        : 'Cosas que tienes que pagar. Elige un pack y después pones la fecha límite de cada una.'} Son solo sugerencias: revisa que apliquen a tu caso.</p>
      <div class="pack-grid">
        ${available.map(([key, p]) => `<button class="pack-btn" data-action="pick-pack" data-pack="${key}"><strong>${p.emoji} ${p.title}</strong><span>${p[listKey].length} ${isTask ? 'recordatorios' : 'pagos'}</span></button>`).join('')}
      </div>`;
  } else {
    const defDate = defaultDate();
    body = `
      <p class="modal-title">${pack.emoji} ${pack.title}</p>
      <p class="sub" style="margin-bottom:14px;">${isTask
        ? 'Desmarca lo que no necesites y cambia nombres y fechas. La fecha es el día en que tienes que hacerlo.'
        : 'Desmarca lo que no necesites y cambia nombres y fechas. La fecha es el día límite para pagar.'}</p>
      ${pack[listKey].map((tpl, i) => `
        <div class="tpl-row">
          <input type="checkbox" id="tpl-chk-${i}" checked>
          <div>
            <input type="text" id="tpl-name-${i}" value="${esc(tpl.name)}">
            <span class="tpl-tag">${RECURRENCE_LABEL[tpl.recurrence] ? 'Se repite ' + RECURRENCE_LABEL[tpl.recurrence] : (isTask ? 'Una sola vez' : 'Pago único')}</span>
          </div>
          <input type="date" id="tpl-date-${i}" value="${defDate}">
        </div>`).join('')}
      <div style="margin-top:14px;display:flex;gap:8px;">
        <button class="btn-ghost-sm" data-action="back-packs">← Volver</button>
        <button class="btn-primary" data-action="add-template-items" style="flex:1;">Añadir seleccionados</button>
      </div>`;
  }
  return `<div class="modal-backdrop" data-action="close-templates"><div class="modal-box" onclick="event.stopPropagation()">${body}</div></div>`;
}

function renderItemRow(item) {
  const u = urgency(item);
  const isTask = item.kind === 'tarea';
  const colors = {
    red: ['var(--danger-bg)','var(--danger-ink)'],
    orange: ['var(--orange-bg)','var(--orange-ink)'],
    yellow: ['var(--yellow-bg)','var(--yellow-ink)'],
    green: ['var(--green-bg)','var(--green-ink)'],
  };
  const [bg, ink] = colors[u.level];
  const chanIcons = (item.notify_whatsapp ? '💬' : '') + ' ' + (item.notify_mail ? '✉️' : '');
  const actions = `
    <button class="icon-action-btn" data-action="open-edit-modal" data-id="${item.id}" title="Editar" aria-label="Editar">✏️</button>
    <button class="icon-action-btn" data-action="delete-item" data-id="${item.id}" title="Eliminar" aria-label="Eliminar">🗑️</button>`;

  if (isTask) {
    let when;
    if (item.paid) when = 'Hecho' + (item.paid_on ? ' el ' + fmtDate(new Date(item.paid_on + 'T00:00:00')) : '');
    else if (u.daysLeft < 0) when = 'Vencido hace ' + (-u.daysLeft) + (u.daysLeft === -1 ? ' día' : ' días');
    else if (u.daysLeft === 0) when = 'Hoy';
    else if (u.daysLeft === 1) when = 'Mañana';
    else when = 'En ' + u.daysLeft + ' días · ' + fmtDate(u.due);
    if (item.due_time && !item.paid) when += ' · ' + item.due_time.slice(0, 5);
    const rec = RECURRENCE_LABEL[item.recurrence] ? ' · se repite ' + RECURRENCE_LABEL[item.recurrence] : '';
    const metaColor = (item.paid || u.level === 'green') ? 'var(--muted)' : ink;
    return `
    <div class="task-row ${item.paid ? 'is-done' : ''}">
      <button class="task-check" data-action="${item.paid ? 'undo-paid' : 'mark-paid'}" data-id="${item.id}" title="${item.paid ? 'Marcar como pendiente' : 'Marcar como hecho'}" aria-label="${item.paid ? 'Marcar como pendiente' : 'Marcar como hecho'}">${item.paid ? '✓' : ''}</button>
      <div class="item-mid">
        <p class="name">${esc(item.name)}</p>
        <p class="meta" style="color:${metaColor};">${when}${rec}</p>
      </div>
      <div class="chan-icons">${chanIcons}</div>
      ${actions}
    </div>`;
  }

  const rec = RECURRENCE_LABEL[item.recurrence] ? 'Se repite ' + RECURRENCE_LABEL[item.recurrence] : 'Pago único';
  const amountHtml = item.amount
    ? `<div class="item-amount">${fmtMoney(item.amount)} €</div>`
    : `<div class="item-amount muted">Sin importe</div>`;
  return `
  <div class="item-row ${item.paid ? 'is-paid' : ''}">
    <div class="icon-badge" style="background:${bg};color:${ink};">${item.paid ? '✓' : '🔔'}</div>
    <div class="item-mid">
      <p class="name">${esc(item.name)}</p>
      <p class="meta">${rec}</p>
    </div>
    ${amountHtml}
    <div class="item-badge-col">
      ${!item.paid ? `<span class="badge" style="background:${bg};color:${ink};">${u.label}</span>` : ''}
      <p class="date-sub">${fmtDate(u.due)}</p>
    </div>
    <div class="chan-icons">${chanIcons}</div>
    ${!item.paid
      ? `<button class="mark-paid-btn" data-action="mark-paid" data-id="${item.id}">Pagado</button>`
      : `<button class="mark-paid-btn is-done" data-action="undo-paid" data-id="${item.id}">Al día</button>`}
    ${actions}
  </div>`;
}

function renderModal() {
  const it = state.editingItem;
  const isTask = state.modalKind === 'tarea';
  const isEdit = !!it;
  const nameVal = isEdit ? it.name : '';
  const amountVal = isEdit && it.amount != null ? String(it.amount).replace('.', ',') : '';
  const dateVal = isEdit ? it.due_date : defaultDate();
  const timeVal = isEdit && it.due_time ? it.due_time.slice(0, 5) : '';
  const recurrenceVal = isEdit ? it.recurrence : (isTask ? 'no' : 'mes');
  const sharedId = state.itemSharedId;
  const sharedPeople = sharedId ? participantsOf(sharedId) : [];
  const sharedN = sharedPeople.length + 1;
  const itemMode = state.itemSplitMode;
  const itemShares = state.itemShares;
  const itemSum = Object.values(itemShares).reduce((a, b) => a + (Number(b) || 0), 0);
  const itemSumOk = Math.abs(itemSum - 100) < 0.05;
  const itemShareRow = (key, label, dotColor) => `
    <div class="share-row">
      <div class="share-name">${dotColor ? `<span class="partner-dot" style="background:${dotColor};"></span>` : ''}${label}</div>
      <input type="number" min="0" max="100" step="1" value="${itemShares[key] != null ? itemShares[key] : ''}" oninput="state.itemShares['${key.replace(/'/g, "\\'")}'] = this.value;" onblur="render();">
      <span class="sub" style="width:14px;">%</span>
    </div>`;
  const waChecked = isEdit ? it.notify_whatsapp : true;
  const mailChecked = isEdit ? it.notify_mail : true;
  return `
  <div class="modal-backdrop" data-action="close-modal">
    <div class="modal-box" onclick="event.stopPropagation()">
      <p class="modal-title">${isEdit ? 'Editar' : (isTask ? 'Nuevo recordatorio' : 'Añadir nuevo')}</p>
      <div class="field"><label class="field-label">Nombre</label><input id="new-name" type="text" placeholder="${isTask ? 'Cita médica, renovar el DNI...' : 'Spotify, alquiler, IVA...'}" value="${esc(nameVal)}"></div>
      <div class="row2">
        ${isTask
          ? `<div class="field"><label class="field-label">Fecha</label><input id="new-date" type="date" value="${dateVal}"></div>
             <div class="field"><label class="field-label">Hora (opcional)</label><input id="new-time" type="time" value="${timeVal}"></div>`
          : `<div class="field"><label class="field-label">Importe (opcional)</label><input id="new-amount" type="text" placeholder="9,99" value="${amountVal}"></div>
             <div class="field"><label class="field-label">Fecha</label><input id="new-date" type="date" value="${dateVal}"></div>`}
      </div>
      <div class="field">
        <label class="field-label">Se repite</label>
        <select id="new-recurrence">
          <option value="no" ${recurrenceVal==='no'?'selected':''}>No se repite</option>
          <option value="mes" ${recurrenceVal==='mes'?'selected':''}>Cada mes</option>
          <option value="trimestre" ${recurrenceVal==='trimestre'?'selected':''}>Cada trimestre</option>
          <option value="anio" ${recurrenceVal==='anio'?'selected':''}>Cada año</option>
        </select>
      </div>
      ${!isTask && state.partners.length ? `
      <div class="field">
        <label class="field-label">¿Lo compartís con alguien?</label>
        <select id="new-shared" onchange="state.itemSharedId = this.value; if (this.value) { const pp = participantsOf(this.value); const base = Math.floor(1000 / (pp.length + 1)) / 10; state.itemShares = { yo: base + (100 - base * (pp.length + 1)) }; pp.forEach(p => { state.itemShares[p.name] = base; }); } state.itemSplitMode = 'equal'; render();">
          <option value="">No compartir</option>
          ${state.partners.map(p => `<option value="${p.id}" ${sharedId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
        </select>
        <p class="sub" style="margin:6px 0 0;">Se anota en ese espacio recién cuando lo marques como pagado, no ahora al guardarlo. Cada vez que se repita y lo pagues, se vuelve a anotar.</p>
      </div>
      ${sharedId ? `
      <div class="field">
        <label class="field-label">¿Quién lo va a pagar?</label>
        <select id="item-paidby" onchange="state.itemPaidBy = this.value; render();">
          <option value="yo" ${state.itemPaidBy === 'yo' ? 'selected' : ''}>Yo</option>
          ${sharedPeople.map(x => `<option value="${esc(x.name)}" ${state.itemPaidBy === x.name ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
          <option value="split" ${state.itemPaidBy === 'split' ? 'selected' : ''}>Pago directo</option>
        </select>
      </div>
      ${state.itemPaidBy === 'split'
        ? `<p class="sub" style="margin:0 0 14px;">Cada uno le paga directo su parte a quien corresponda. No queda nadie debiéndole nada a nadie por este gasto.</p>`
        : `<label class="field-label">¿Cómo se reparte?</label>
      <div class="mode-toggle">
        <button type="button" class="${itemMode === 'equal' ? 'active' : ''}" data-action="item-split-mode" data-mode="equal">Partes iguales</button>
        <button type="button" class="${itemMode === 'custom' ? 'active' : ''}" data-action="item-split-mode" data-mode="custom">Personalizado</button>
      </div>
      ${itemMode === 'equal'
        ? `<p class="sub" style="margin:0 0 14px;">Se reparte en partes iguales entre los ${sharedN} (${fmtMoney(100 / sharedN)}% cada uno).</p>`
        : `<div style="margin-bottom:6px;">
            ${itemShareRow('yo', 'Yo', null)}
            ${sharedPeople.map(x => itemShareRow(x.name, esc(x.name), x.color)).join('')}
          </div>
          <p class="share-total ${itemSumOk ? 'ok' : 'bad'}">Suman ${fmtMoney(itemSum)}%${itemSumOk ? ' ✓' : ' — tiene que sumar 100%'}</p>
          <div style="height:8px;"></div>`}`}` : ''}` : ''}
      <label class="chan-option"><input type="checkbox" id="new-chk-wa" ${waChecked?'checked':''}> WhatsApp</label>
      <label class="chan-option"><input type="checkbox" id="new-chk-mail" ${mailChecked?'checked':''}> Mail</label>
      <div style="margin-top:14px;">
        <button class="btn-primary" data-action="save-item" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Guardando…' : (isEdit ? 'Guardar cambios' : 'Guardar')}</button>
      </div>
    </div>
  </div>`;
}

function attachHandlers() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', async (e) => {
      const action = el.getAttribute('data-action');

      if (action === 'go-plan') { state.screen = 'plan'; render(); }
      else if (action === 'pick-plan') { state.chosenPlan = el.getAttribute('data-plan'); render(); }
      else if (action === 'start-trial') {
        const trial_ends_at = toDateStr(addDays(today, 15));
        const { error } = await sb.from('profiles').upsert({ id: state.session.user.id, plan: 'trial', trial_ends_at });
        if (error) { showToast('No se pudo activar la prueba: ' + error.message); return; }
        await loadProfile();
      }
      else if (action === 'go-auth') { state.screen = 'auth'; render(); }
      else if (action === 'auth-mode-signup') { state.authMode = 'signup'; state.authError=''; state.confirmMsg=''; render(); }
      else if (action === 'auth-mode-signin') { state.authMode = 'signin'; state.authError=''; state.confirmMsg=''; render(); }
      else if (action === 'tab-proximos') { state.activeTab = 'proximos'; state.summaryFilter = null; render(); }
      else if (action === 'tab-todo') { state.activeTab = 'todo'; state.summaryFilter = null; render(); }
      else if (action === 'filter-paid') { state.summaryFilter = state.summaryFilter === 'paid' ? null : 'paid'; render(); }
      else if (action === 'filter-next') { state.summaryFilter = state.summaryFilter === 'next' ? null : 'next'; render(); }
      else if (action === 'filter-active') { state.summaryFilter = state.summaryFilter === 'active' ? null : 'active'; render(); }
      else if (action === 'filter-overdue') { state.summaryFilter = state.summaryFilter === 'overdue' ? null : 'overdue'; render(); }
      else if (action === 'filter-today') { state.summaryFilter = state.summaryFilter === 'today' ? null : 'today'; render(); }
      else if (action === 'filter-week') { state.summaryFilter = state.summaryFilter === 'week' ? null : 'week'; render(); }
      else if (action === 'open-modal') {
        state.modalOpen = true; state.editingItem = null; state.modalKind = state.section === 'recordatorios' ? 'tarea' : 'pago';
        state.itemSharedId = ''; state.itemPaidBy = 'yo'; state.itemSplitMode = 'equal'; state.itemShares = {};
        render();
      }
      else if (action === 'open-edit-modal') {
        const id = el.getAttribute('data-id');
        state.editingItem = state.items.find(i => String(i.id) === String(id)) || null;
        state.modalKind = (state.editingItem && state.editingItem.kind) || 'pago';
        const it = state.editingItem;
        state.itemSharedId = (it && it.shared_partner_id) || '';
        state.itemPaidBy = (it && it.shared_paid_by) || 'yo';
        state.itemSplitMode = (it && it.split_type) || 'equal';
        state.itemShares = (it && it.shares) ? { ...it.shares } : {};
        state.modalOpen = true; render();
      }
      else if (action === 'close-modal') { state.modalOpen = false; state.editingItem = null; render(); }
      else if (action === 'delete-item') {
        const id = el.getAttribute('data-id');
        if (!confirm('¿Eliminar este ítem? No se puede deshacer.')) return;
        const { error } = await sb.from('items').delete().eq('id', id);
        if (error) { showToast('No se pudo eliminar: ' + error.message); return; }
        await loadItems();
      }
      else if (action === 'section-presupuesto') { state.section = 'presupuesto'; state.summaryFilter = null; state.activeTab = 'proximos'; state.notice = ''; render(); }
      else if (action === 'section-compartido') { state.section = 'compartido'; state.notice = ''; render(); }
      else if (action === 'select-partner') { state.activePartnerId = el.getAttribute('data-id'); render(); }
      else if (action === 'open-partner-modal') { state.partnerModal = true; render(); }
      else if (action === 'close-partner-modal') { state.partnerModal = false; render(); }
      else if (action === 'save-partner') {
        const name = document.getElementById('partner-name').value.trim();
        if (!name) { showToast('Ponle un nombre.'); return; }
        el.disabled = true;
        const { data, error } = await sb.from('shared_partners').insert({ user_id: state.session.user.id, name }).select();
        if (error) { el.disabled = false; showToast('No se pudo guardar: ' + error.message); return; }
        const newId = data && data[0] && data[0].id;
        state.partnerModal = false;
        state.partnersLoaded = false;
        await loadShared();
        if (newId) state.activePartnerId = newId;
        render();
      }
      else if (action === 'delete-partner') {
        const id = el.getAttribute('data-id');
        const p = state.partners.find(x => x.id === id);
        if (!confirm('¿Eliminar "' + (p ? p.name : 'este espacio') + '" con las personas y los gastos que tiene adentro? No se puede deshacer.')) return;
        const { error } = await sb.from('shared_partners').delete().eq('id', id);
        if (error) { showToast('No se pudo eliminar: ' + error.message); return; }
        state.activePartnerId = null;
        state.partnersLoaded = false;
        await loadShared(); render();
      }
      else if (action === 'open-person-modal') { state.personModal = true; state.newPersonColor = PARTNER_COLORS[participantsOf(state.activePartnerId).length % PARTNER_COLORS.length]; render(); }
      else if (action === 'close-person-modal') { state.personModal = false; render(); }
      else if (action === 'pick-person-color') { state.newPersonColor = el.getAttribute('data-color'); render(); }
      else if (action === 'save-person') {
        const name = document.getElementById('person-name').value.trim();
        if (!name) { showToast('Ponle un nombre.'); return; }
        el.disabled = true;
        const { error } = await sb.from('shared_participants').insert({ partner_id: state.activePartnerId, name, color: state.newPersonColor });
        if (error) { el.disabled = false; showToast('No se pudo guardar: ' + error.message); return; }
        state.personModal = false;
        state.partnersLoaded = false;
        await loadShared(); render();
      }
      else if (action === 'delete-person') {
        const id = el.getAttribute('data-id');
        if (!confirm('¿Quitar a esta persona? Sus gastos ya cargados quedan igual, en adelanto el reparto se calcula sin ella.')) return;
        const { error } = await sb.from('shared_participants').delete().eq('id', id);
        if (error) { showToast('No se pudo quitar: ' + error.message); return; }
        state.partnersLoaded = false;
        await loadShared(); render();
      }
      else if (action === 'open-expense-modal') {
        const id = el.getAttribute('data-id');
        const editing = id ? (state.sharedExpenses.find(x => String(x.id) === String(id)) || null) : null;
        state.expenseModal = { editing };
        if (editing && editing.shares) { state.splitMode = 'custom'; state.customShares = { ...editing.shares }; }
        else { state.splitMode = 'equal'; state.customShares = {}; }
        render();
      }
      else if (action === 'close-expense-modal') { state.expenseModal = null; render(); }
      else if (action === 'split-mode') {
        const mode = el.getAttribute('data-mode');
        if (mode === 'custom' && state.splitMode !== 'custom') {
          const people = participantsOf(state.activePartnerId);
          const N = people.length + 1;
          const base = Math.floor(100 / N);
          state.customShares = { yo: base + (100 - base * N) };
          people.forEach(p => { state.customShares[p.name] = base; });
        }
        state.splitMode = mode;
        render();
      }
      else if (action === 'item-split-mode') {
        const mode = el.getAttribute('data-mode');
        if (mode === 'custom' && state.itemSplitMode !== 'custom') {
          const people = participantsOf(state.itemSharedId);
          const N = people.length + 1;
          const base = Math.floor(100 / N);
          state.itemShares = { yo: base + (100 - base * N) };
          people.forEach(p => { state.itemShares[p.name] = base; });
        }
        state.itemSplitMode = mode;
        render();
      }
      else if (action === 'save-expense') {
        const description = document.getElementById('exp-desc').value.trim();
        const amount = parseAmount(document.getElementById('exp-amount').value);
        const expense_date = document.getElementById('exp-date').value || toDateStr(today);
        const paid_by = document.getElementById('exp-paidby').value;
        if (!description) { showToast('Contá qué fue el gasto.'); return; }
        if (!(amount > 0)) { showToast('Pon un importe mayor que 0.'); return; }
        let shares = null;
        if (paid_by !== 'split' && state.splitMode === 'custom') {
          shares = {};
          Object.keys(state.customShares).forEach(k => { shares[k] = Number(state.customShares[k]) || 0; });
          const sum = Object.values(shares).reduce((a, b) => a + b, 0);
          if (Math.abs(sum - 100) > 0.5) { showToast('Los porcentajes tienen que sumar 100 (suman ' + fmtMoney(sum) + ').'); return; }
        }
        const recEl = document.getElementById('exp-recurrence');
        const recurrence = recEl && !recEl.disabled ? recEl.value : (state.expenseModal.editing ? state.expenseModal.editing.recurrence : 'no');
        const toPagosEl = document.getElementById('exp-to-pagos');
        const toPagos = toPagosEl ? toPagosEl.checked : false;
        const editing = state.expenseModal.editing;
        const yaVinculado = editing && editing.created_item_id;
        el.disabled = true;
        let created_item_id = editing ? editing.created_item_id : null;
        if (toPagos && !yaVinculado) {
          // Crea el pago vinculado, tanto si el gasto es nuevo como si se edita uno que todavía no estaba trasladado.
          const anchor_day = recurrence !== 'no' ? parseInt(expense_date.slice(8, 10), 10) : null;
          const due_date = recurrence === 'no' ? expense_date : toDateStr(nextOccurrence({ due_date: expense_date, recurrence, anchor_day }));
          const { data: itemData, error: itemErr } = await sb.from('items').insert({
            user_id: state.session.user.id, name: description, amount, due_date, recurrence, anchor_day,
            kind: 'pago', notify_whatsapp: false, notify_mail: true, shared_partner_id: state.activePartnerId,
            shared_paid_by: paid_by, split_type: shares ? 'custom' : 'equal', shares,
            paid: recurrence === 'no', paid_on: recurrence === 'no' ? expense_date : null
          }).select();
          if (itemErr) { el.disabled = false; showToast('No se pudo trasladar a Gastos: ' + itemErr.message); return; }
          created_item_id = itemData && itemData[0] && itemData[0].id;
        }
        const row = { description, amount, expense_date, paid_by, shares, recurrence, created_item_id };
        let error;
        if (editing) ({ error } = await sb.from('shared_expenses').update(row).eq('id', editing.id));
        else ({ error } = await sb.from('shared_expenses').insert({ ...row, user_id: state.session.user.id, partner_id: state.activePartnerId }));
        if (error) { el.disabled = false; showToast('No se pudo guardar: ' + error.message); return; }
        state.expenseModal = null;
        state.partnersLoaded = false;
        await loadShared();
        await loadItems(); // por si se creó un pago vinculado, que Pagos y Presupuesto ya lo vean
        render();
      }
      else if (action === 'delete-expense') {
        const id = el.getAttribute('data-id');
        if (!confirm('¿Eliminar este gasto? No se puede deshacer.')) return;
        const { error } = await sb.from('shared_expenses').delete().eq('id', id);
        if (error) { showToast('No se pudo eliminar: ' + error.message); return; }
        state.partnersLoaded = false;
        await loadShared(); render();
      }
      
      else if (action === 'month-prev') { shiftMonth(-1); }
      else if (action === 'month-next') { shiftMonth(1); }
      else if (action === 'month-today') { changeMonth(currentYm()); }
      else if (action === 'open-entry') {
        const id = el.getAttribute('data-id');
        const editing = id ? (state.entries.find(x => String(x.id) === String(id)) || null) : null;
        state.entryModal = { type: editing ? editing.type : el.getAttribute('data-type'), editing }; render();
      }
      else if (action === 'close-entry') { state.entryModal = null; render(); }
      else if (action === 'entry-chip') { document.getElementById('entry-name').value = el.getAttribute('data-name'); }
      else if (action === 'save-entry') {
        const m = state.entryModal; if (!m) return;
        const name = document.getElementById('entry-name').value.trim();
        const amount = parseAmount(document.getElementById('entry-amount').value);
        if (!name) { showToast('Ponle un nombre.'); return; }
        if (!(amount > 0)) { showToast('Pon un importe mayor que 0.'); return; }
        const scopeEl = document.getElementById('entry-scope');
        const scope = scopeEl ? scopeEl.value : 'all';
        const row = { type: m.type, name, amount };
        if (scope === 'only') row.month = state.viewMonth;
        else if (m.editing && m.editing.month) row.month = null;
        el.disabled = true;
        let error;
        if (m.editing) ({ error } = await sb.from('budget_entries').update(row).eq('id', m.editing.id));
        else ({ error } = await sb.from('budget_entries').insert({ ...row, user_id: state.session.user.id }));
        if (error) { el.disabled = false; showToast('No se pudo guardar: ' + error.message); return; }
        state.entryModal = null;
        await loadEntries(); render();
      }
      else if (action === 'delete-entry') {
        const id = el.getAttribute('data-id');
        if (!confirm('¿Eliminar? No se puede deshacer.')) return;
        const { error } = await sb.from('budget_entries').delete().eq('id', id);
        if (error) { showToast('No se pudo eliminar: ' + error.message); return; }
        await loadEntries(); render();
      }
      else if (action === 'section-pagos') { state.section = 'pagos'; state.summaryFilter = null; state.activeTab = 'proximos'; state.notice = ''; render(); }
      else if (action === 'section-recordatorios') { state.section = 'recordatorios'; state.summaryFilter = null; state.activeTab = 'proximos'; state.notice = ''; render(); }
      else if (action === 'open-templates') { state.templatesOpen = true; state.templatePack = null; render(); }
      else if (action === 'close-templates') { state.templatesOpen = false; state.templatePack = null; render(); }
      else if (action === 'pick-pack') { state.templatePack = el.getAttribute('data-pack'); render(); }
      else if (action === 'back-packs') { state.templatePack = null; render(); }
      else if (action === 'add-template-items') {
        const pack = TEMPLATE_PACKS[state.templatePack];
        if (!pack) return;
        const isTask = state.section === 'recordatorios';
        const tpls = pack[isTask ? 'tareas' : 'pagos'] || [];
        const kind = isTask ? 'tarea' : 'pago';
        const rows = [];
        tpls.forEach((tpl, i) => {
          const chk = document.getElementById('tpl-chk-' + i);
          if (!chk || !chk.checked) return;
          const nm = (document.getElementById('tpl-name-' + i).value || '').trim() || tpl.name;
          const dt = document.getElementById('tpl-date-' + i).value || defaultDate();
          rows.push({ user_id: state.session.user.id, name: nm, amount: null, due_date: dt, recurrence: tpl.recurrence, notify_whatsapp: false, notify_mail: true, kind, anchor_day: tpl.recurrence !== 'no' ? parseInt(dt.slice(8, 10), 10) : null });
        });
        if (!rows.length) { showToast('Marca al menos una opción.'); return; }
        el.disabled = true;
        const { error } = await sb.from('items').insert(rows);
        if (error) { el.disabled = false; showToast('No se pudo añadir: ' + error.message); return; }
        state.notice = 'Añadimos ' + rows.length + (isTask ? ' recordatorios' : ' pagos') + ' del pack "' + esc(pack.title) + '". ' + (isTask ? 'Ajusta nombres y fechas' : 'Pon los importes y ajusta las fechas') + ' cuando quieras con el lápiz ✏️.';
        state.templatesOpen = false; state.templatePack = null;
        await loadItems();
      }
      else if (action === 'go-profile') {
        state.screen = 'profile'; state.profileMsg = ''; state.profileError = ''; render();
        await loadProfile();
      }
      else if (action === 'go-app-from-profile') {
        state.screen = 'app'; render();
      }
      else if (action === 'save-profile') {
        const phone = document.getElementById('profile-phone').value.trim();
        state.busy = true; state.profileMsg = ''; state.profileError = ''; render();
        const { error } = await sb.from('profiles').upsert({
          id: state.session.user.id, phone: phone || null, avatar_url: state.profile.avatar_url || null
        });
        state.busy = false;
        if (error) { state.profileError = 'No se pudo guardar: ' + error.message; render(); return; }
        state.profile.phone = phone;
        state.profileMsg = 'Listo, guardado.';
        render();
      }
      else if (action === 'update-password') {
        const p1 = document.getElementById('profile-new-password').value;
        const p2 = document.getElementById('profile-new-password-2').value;
        state.profileMsg = ''; state.profileError = '';
        if (!p1 || !p2) { state.profileError = 'Completa los dos campos de contraseña.'; render(); return; }
        if (p1 !== p2) { state.profileError = 'Las contraseñas no coinciden.'; render(); return; }
        state.busy = true; render();
        const { error } = await sb.auth.updateUser({ password: p1 });
        state.busy = false;
        if (error) { state.profileError = 'No se pudo actualizar: ' + error.message; render(); return; }
        state.profileMsg = 'Contraseña actualizada.';
        render();
      }
      else if (action === 'sign-out') {
        await sb.auth.signOut();
        state.session = null; state.items = []; state.notice = ''; state.entries = []; state.entriesLoaded = false; state.entriesError = ''; state.entryModal = null; state.viewMonth = currentYm(); state.partners = []; state.sharedExpenses = []; state.partnersLoaded = false; state.activePartnerId = null; state.partnerModal = false; state.expenseModal = null; state.personModal = false; state.sharedParticipants = []; state.splitMode = 'equal'; state.customShares = {}; state.itemSharedId = ''; state.itemPaidBy = 'yo'; state.itemSplitMode = 'equal'; state.itemShares = {}; state.screen = 'plan'; render();
      }
      else if (action === 'do-signup') {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        if (!email || !password) { state.authError = 'Completa email y contraseña.'; render(); return; }
        state.busy = true; state.authError = ''; render();
        const { data, error } = await sb.auth.signUp({ email, password });
        state.busy = false;
        if (error) { state.authError = error.message; render(); return; }
        if (data.session) {
          state.session = data.session; state.screen = 'channels'; render();
        } else {
          state.confirmMsg = 'Te mandamos un mail de confirmación. Confírmalo y después inicia sesión desde aquí.';
          state.authMode = 'signin'; render();
        }
      }
      else if (action === 'do-signin') {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        if (!email || !password) { state.authError = 'Completa email y contraseña.'; render(); return; }
        state.busy = true; state.authError = ''; render();
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        state.busy = false;
        if (error) { state.authError = error.message; render(); return; }
        state.session = data.session; state.screen = 'app'; render();
        await loadItems();
      }
      else if (action === 'save-channels') {
        const phone = document.getElementById('channels-phone').value.trim();
        state.busy = true; render();
        const plan = state.chosenPlan === 'trial' ? 'trial' : 'free';
        const trial_ends_at = plan === 'trial' ? toDateStr(addDays(today, 15)) : null;
        const { error } = await sb.from('profiles').upsert({ id: state.session.user.id, phone: phone || null, plan, trial_ends_at });
        state.busy = false;
        if (error) { showToast('No se pudo guardar el teléfono: ' + error.message); }
        state.screen = 'app'; render();
        await loadItems();
      }
      else if (action === 'mark-paid') {
        const id = el.getAttribute('data-id');
        const item = state.items.find(i => String(i.id) === String(id));
        const { error } = await sb.from('items').update({ paid: true, paid_on: toDateStr(today) }).eq('id', id);
        if (error) { showToast('No se pudo actualizar: ' + error.message); return; }
        // Si se repite, se crea solo el siguiente (una sola vez, aunque se toque dos veces)
        if (item && item.recurrence && item.recurrence !== 'no') {
          const { data: kids } = await sb.from('items').select('id').eq('renewed_from', id).eq('paid', false);
          if (!kids || kids.length === 0) {
            const n = nextOccurrence(item);
            const { error: e2 } = await sb.from('items').insert({
              user_id: state.session.user.id, name: item.name, amount: item.amount, due_date: toDateStr(n),
              recurrence: item.recurrence, notify_whatsapp: item.notify_whatsapp, notify_mail: item.notify_mail,
              kind: item.kind || 'pago', renewed_from: item.id,
              anchor_day: item.anchor_day || parseInt(item.due_date.slice(8, 10), 10),
              shared_partner_id: item.shared_partner_id || null, shared_paid_by: item.shared_paid_by || null,
              split_type: item.split_type || 'equal', shares: item.shares || null
            });
            if (e2) showToast('Se marcó, pero no se pudo crear la próxima fecha: ' + e2.message);
          }
        }
        // Si el pago está vinculado a un espacio de Gastos compartidos, se anota solo ahí (sin cargarlo dos veces)
        if (item && item.kind !== 'tarea' && item.shared_partner_id) {
          if (item.amount > 0) {
            const { error: e3 } = await sb.from('shared_expenses').insert({
              user_id: state.session.user.id, partner_id: item.shared_partner_id,
              description: item.name, amount: item.amount, paid_by: item.shared_paid_by || 'yo',
              shares: item.split_type === 'custom' ? item.shares : null,
              expense_date: toDateStr(today), from_item_id: item.id
            });
            if (e3) showToast('Se marcó como pagado, pero no se pudo anotar en compartido: ' + e3.message);
          } else {
            showToast('Se marcó como pagado. Como no tiene importe, no se anotó en el espacio compartido.');
          }
          await loadShared();
        }
        await loadItems();
      }
      else if (action === 'undo-paid') {
        const id = el.getAttribute('data-id');
        const { error } = await sb.from('items').update({ paid: false, paid_on: null }).eq('id', id);
        if (error) { showToast('No se pudo actualizar: ' + error.message); return; }
        // Deshace la renovación automática, salvo que la siguiente ya se haya pagado
        await sb.from('items').delete().eq('renewed_from', id).eq('paid', false);
        // Deshace el gasto compartido que se había anotado solo, si lo hubo
        await sb.from('shared_expenses').delete().eq('from_item_id', id);
        await loadShared();
        await loadItems();
      }
      else if (action === 'save-item') {
        const name = document.getElementById('new-name').value.trim();
        if (!name) return;
        const amtEl = document.getElementById('new-amount');
        const parsedAmt = amtEl ? parseAmount(amtEl.value) : NaN;
        const amount = (state.modalKind !== 'tarea' && !isNaN(parsedAmt)) ? parsedAmt : null;
        const dateVal = document.getElementById('new-date').value || defaultDate();
        const timeEl = document.getElementById('new-time');
        const due_time = timeEl && timeEl.value ? timeEl.value : null;
        const recurrence = document.getElementById('new-recurrence').value;
        const notify_whatsapp = document.getElementById('new-chk-wa').checked;
        const notify_mail = document.getElementById('new-chk-mail').checked;
        const anchor_day = recurrence !== 'no' ? parseInt(dateVal.slice(8, 10), 10) : null;
        const sharedEl = document.getElementById('new-shared');
        const shared_partner_id = sharedEl && sharedEl.value ? sharedEl.value : null;
        let shared_paid_by = null, split_type = 'equal', shares = null;
        if (shared_partner_id) {
          shared_paid_by = state.itemPaidBy || 'yo';
          if (shared_paid_by !== 'split' && state.itemSplitMode === 'custom') {
            split_type = 'custom';
            shares = {};
            Object.keys(state.itemShares).forEach(k => { shares[k] = Number(state.itemShares[k]) || 0; });
            const sum = Object.values(shares).reduce((a, b) => a + b, 0);
            if (Math.abs(sum - 100) > 0.5) { showToast('Los porcentajes tienen que sumar 100 (suman ' + fmtMoney(sum) + ').'); return; }
          }
        }
        state.busy = true; render();
        let error;
        if (state.editingItem) {
          ({ error } = await sb.from('items').update({
            name, amount, due_date: dateVal, due_time, recurrence, notify_whatsapp, notify_mail, anchor_day,
            shared_partner_id, shared_paid_by, split_type, shares
          }).eq('id', state.editingItem.id));
        } else {
          ({ error } = await sb.from('items').insert({
            user_id: state.session.user.id, name, amount, due_date: dateVal, due_time, recurrence, notify_whatsapp, notify_mail, kind: state.modalKind, anchor_day,
            shared_partner_id, shared_paid_by, split_type, shares
          }));
        }
        state.busy = false;
        if (error) { showToast('No se pudo guardar: ' + error.message); state.modalOpen = false; state.editingItem = null; render(); return; }
        state.modalOpen = false; state.editingItem = null;
        await loadItems();
      }
    });
  });
}

init();
</script>

</html>
