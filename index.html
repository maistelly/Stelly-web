<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stelly — organiza lo que tienes que pagar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF6EE;
    --surface: #FFFFFF;
    --surface-2: #F3EDE0;
    --border: #E7DFCD;
    --ink: #38332A;
    --muted: #8A8171;
    --accent: #E8C767;
    --accent-ink: #3A342A;
    --danger-bg: #FBE8E4; --danger-ink: #A33A22;
    --orange-bg: #FBEEE1; --orange-ink: #9C5620;
    --yellow-bg: #FBF3DC; --yellow-ink: #8A6C0F;
    --green-bg: #E7F1E7; --green-ink: #2C6B3F;
    --radius: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #1B1913; --surface: #26221A; --surface-2: #302B20;
      --border: #423C2C; --ink: #F5F0E3; --muted: #B3AA95;
      --danger-bg: #3A2320; --danger-ink: #F0998A;
      --orange-bg: #382A1B; --orange-ink: #F0B679;
      --yellow-bg: #362F16; --yellow-ink: #E9CD6C;
      --green-bg: #1E2E22; --green-ink: #86D19B;
    }
  }
  .jasmine-icon { width: 32px; height: 32px; vertical-align: -9px; margin-right: 8px; }
  .jasmine-icon-sm { width: 24px; height: 24px; vertical-align: -6px; margin-right: 6px; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100%; -webkit-font-smoothing: antialiased;
  }
  body.has-bloom {
    background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><g transform="translate(60,60) rotate(15) scale(0.75)"><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(0)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(72)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(144)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(216)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(288)"/><circle r="3.2" fill="%23E8C767" fill-opacity="0.4"/><path d="M -3,14 C -10,10 -14,18 -9,24 C -6,19 -4,17 -3,14 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><path d="M 3,16 C 10,13 15,20 10,27 C 6,22 4,19 3,16 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><line x1="0" y1="10" x2="0" y2="26" stroke="%237C8F5D" stroke-opacity="0.24" stroke-width="0.8"/></g><g transform="translate(230,90) rotate(-30) scale(0.55)"><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(0)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(72)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(144)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(216)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(288)"/><circle r="3.2" fill="%23E8C767" fill-opacity="0.4"/><path d="M -3,14 C -10,10 -14,18 -9,24 C -6,19 -4,17 -3,14 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><path d="M 3,16 C 10,13 15,20 10,27 C 6,22 4,19 3,16 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><line x1="0" y1="10" x2="0" y2="26" stroke="%237C8F5D" stroke-opacity="0.24" stroke-width="0.8"/></g><g transform="translate(150,230) rotate(50) scale(0.65)"><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(0)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(72)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(144)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(216)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(288)"/><circle r="3.2" fill="%23E8C767" fill-opacity="0.4"/><path d="M -3,14 C -10,10 -14,18 -9,24 C -6,19 -4,17 -3,14 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><path d="M 3,16 C 10,13 15,20 10,27 C 6,22 4,19 3,16 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><line x1="0" y1="10" x2="0" y2="26" stroke="%237C8F5D" stroke-opacity="0.24" stroke-width="0.8"/></g><g transform="translate(280,260) rotate(-10) scale(0.45)"><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(0)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(72)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(144)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(216)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(288)"/><circle r="3.2" fill="%23E8C767" fill-opacity="0.4"/><path d="M -3,14 C -10,10 -14,18 -9,24 C -6,19 -4,17 -3,14 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><path d="M 3,16 C 10,13 15,20 10,27 C 6,22 4,19 3,16 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><line x1="0" y1="10" x2="0" y2="26" stroke="%237C8F5D" stroke-opacity="0.24" stroke-width="0.8"/></g></svg>');
    background-repeat: repeat;
    background-size: 300px 300px;
  }
  input, select, button { font-family: inherit; font-size: 15px; }
  input, select {
    background: var(--surface); border: 1px solid var(--border); color: var(--ink);
    border-radius: 10px; padding: 10px 12px; width: 100%;
  }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  button { cursor: pointer; }
  .btn-primary {
    background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 10px; padding: 13px 18px; font-size: 15px; font-weight: 600; width: 100%;
  }
  .btn-primary:hover { opacity: 0.92; }
  .btn-ghost {
    background: transparent; border: none; color: var(--muted); font-size: 14px; padding: 8px;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 28px 20px 60px; }
  .wrap-wide { max-width: 720px; margin: 0 auto; padding: 24px 20px 80px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px; margin-bottom: 14px;
  }
  .steps { display: flex; gap: 6px; justify-content: center; margin-bottom: 28px; }
  .steps span { width: 26px; height: 4px; border-radius: 2px; background: var(--border); }
  .steps span.done { background: var(--accent); }
  h1.brand { font-size: 15px; font-weight: 700; text-align: center; margin: 0 0 30px; letter-spacing: 0.01em; }
  h2.title { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  p.sub { font-size: 14px; color: var(--muted); margin: 0 0 20px; }
  label.field-label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 5px; }
  .field { margin-bottom: 14px; }
  .price-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 16px; }
  .price-row .amount { font-size: 32px; font-weight: 700; }
  .price-row .period { font-size: 14px; color: var(--muted); }
  ul.feat { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-direction: column; gap: 8px; }
  ul.feat li { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .chan-option {
    display: flex; align-items: center; gap: 10px; font-size: 14px;
    background: var(--surface-2); padding: 12px; border-radius: 12px; margin-bottom: 8px;
  }
  .chan-option input { width: auto; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hidden { display: none !important; }

  /* app screen */
  header.app-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
  }
  header.app-header .brand-name { font-weight: 700; font-size: 16px; }
  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
  @media (min-width: 560px) { .summary-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 559px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
  .summary-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; cursor: pointer; text-align: left; font-family: inherit; }
  .summary-box.is-active { border-color: var(--accent); background: var(--surface-2); }
  .summary-box .label { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .summary-box .value { font-size: 21px; font-weight: 700; margin: 0; }
  .value .of { font-size: 13px; color: var(--muted); font-weight: 400; }
  .tabs { display: inline-flex; gap: 4px; background: var(--surface-2); border-radius: 11px; padding: 4px; margin-bottom: 18px; }
  .tabs button {
    background: transparent; border: none; color: var(--muted); padding: 7px 16px;
    border-radius: 8px; font-size: 14px;
  }
  .tabs button.active { background: var(--surface); color: var(--ink); font-weight: 600; }
  .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .list-header p { font-size: 16px; font-weight: 600; margin: 0; }
  .btn-add {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 10px;
    padding: 9px 15px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px;
  }
  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item-row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px;
  }
  .item-row.is-paid { opacity: 0.62; }
  .icon-badge {
    width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; font-size: 18px;
  }
  .item-mid { flex: 1; min-width: 0; }
  .item-mid .name { font-size: 14px; font-weight: 600; margin: 0; }
  .item-mid .meta { font-size: 12px; color: var(--muted); margin: 3px 0 0; }
  .item-badge-col { text-align: right; flex-shrink: 0; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px; white-space: nowrap; display: inline-block;
  }
  .date-sub { font-size: 11px; color: var(--muted); margin: 4px 0 0; }
  .chan-icons { display: flex; gap: 6px; flex-shrink: 0; color: var(--muted); font-size: 15px; }
  .mark-paid-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; flex-shrink: 0;
  }
  .mark-paid-btn.is-done {
    background: var(--green-bg); border-color: transparent; color: var(--green-ink); font-weight: 600;
  }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
  .empty-state p { margin: 0 0 16px; font-size: 14px; }

  /* modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.42); display: flex;
    align-items: flex-end; justify-content: center; z-index: 50;
  }
  @media (min-width: 560px) { .modal-backdrop { align-items: center; } }
  .modal-box {
    background: var(--surface); border-radius: 20px 20px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto;
  }
  @media (min-width: 560px) { .modal-box { border-radius: 20px; } }
  .modal-title { font-size: 17px; font-weight: 700; margin: 0 0 16px; }
  .toast {
    position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    background: var(--danger-ink); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 20px;
    z-index: 60; max-width: 90vw; text-align: center;
  }
  .auth-tabs { display: flex; gap: 4px; background: var(--surface-2); border-radius: 11px; padding: 4px; margin-bottom: 18px; }
  .auth-tabs button { flex: 1; background: transparent; border: none; color: var(--muted); padding: 8px; border-radius: 8px; font-size: 14px; }
  .auth-tabs button.active { background: var(--surface); color: var(--ink); font-weight: 600; }
  .btn-primary[disabled] { opacity: 0.6; cursor: default; }
  .signout-link { font-size: 13px; color: var(--muted); background: none; border: none; }
  .icon-action-btn { background: transparent; border: none; font-size: 15px; padding: 4px 6px; flex-shrink: 0; opacity: 0.75; }
  .icon-action-btn:hover { opacity: 1; }
  .section-nav { display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border); }
  .section-nav button { background:transparent; border:none; color:var(--muted); padding:10px 14px; font-size:15px; font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .section-nav button.active { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }
  .btn-ghost-sm { background:var(--surface); border:1px solid var(--border); color:var(--ink); border-radius:10px; padding:9px 14px; font-size:14px; font-weight:500; }
  .pack-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
  .pack-btn { text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:14px; color:var(--ink); font-size:14px; }
  .pack-btn strong { display:block; font-size:15px; margin-bottom:2px; }
  .pack-btn span { color:var(--muted); font-size:12px; }
  .tpl-row { display:grid; grid-template-columns:auto 1fr 140px; gap:8px; align-items:center; margin-bottom:10px; }
  .tpl-row input[type=checkbox] { width:auto; }
  .tpl-tag { display:block; font-size:11px; color:var(--muted); margin-top:3px; }
  .task-row { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:12px; }
  .task-row.is-done { opacity:.6; }
  .task-row.is-done .name { text-decoration:line-through; }
  .task-check { width:26px; height:26px; border-radius:50%; border:2px solid var(--border); background:var(--surface); color:var(--accent-ink); font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:0; }
  .task-check:hover { border-color:var(--accent); }
  .task-row.is-done .task-check { background:var(--accent); border-color:var(--accent); }
  .group-title { font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:18px 0 2px; }
  .group-title:first-child { margin-top:0; }
  .item-amount { font-weight:700; font-size:15px; text-align:right; min-width:78px; flex-shrink:0; }
  .item-amount.muted { color:var(--muted); font-weight:400; font-size:12px; }
  @media (max-width: 560px) { .item-row .chan-icons, .task-row .chan-icons { display:none; } }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:-4px 0 14px; }
  .chip { background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:5px 11px; font-size:13px; color:var(--ink); }
  .bud-big { font-size:36px; font-weight:700; margin:0 0 4px; }
  .bud-bar { display:flex; height:14px; border-radius:8px; overflow:hidden; background:var(--surface-2); margin:14px 0 10px; }
  .bud-bar span { display:block; height:100%; }
  .seg-fijo { background:#B99B5B; } .seg-punt { background:#D9C79A; } .seg-var { background:#8FA772; } .seg-sobra { background:var(--accent); }
  .bud-legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--muted); }
  .bud-legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .bud-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .bud-card-head h3 { font-size:15px; margin:0; font-weight:600; }
  .bud-total { font-size:13px; color:var(--muted); font-weight:500; }
  .bud-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--border); }
  .bud-row:first-child { border-top:none; }
  .bud-row .name { flex:1; min-width:0; font-size:14px; }
  .bud-row .sub2 { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
  .bud-row .amt { font-weight:600; font-size:14px; white-space:nowrap; }
  .progress { height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin-top:8px; }
  .progress > span { display:block; height:100%; background:var(--accent); }
  .month-bar { display:flex; align-items:center; gap:10px; margin:0 0 18px; flex-wrap:wrap; }
  .month-box { display:flex; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .month-arrow { background:transparent; border:none; color:var(--ink); font-size:20px; line-height:1; padding:8px 14px; }
  .month-arrow:hover { background:var(--surface-2); }
  .month-box select { width:auto; min-width:170px; border:none; border-left:1px solid var(--border); border-right:1px solid var(--border); border-radius:0; background:transparent; font-weight:600; font-size:15px; padding:9px 12px; text-align:center; text-align-last:center; }
  .projected { opacity:.75; border-style:dashed; }
  .seg-ahorro { background:#6F9FA8; }
  .summary-box.static { cursor:default; }
  .receipt { margin-top:16px; padding-top:12px; border-top:1px dashed var(--border); }
  .receipt-row { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding:4px 0; }
  .receipt-total { margin-top:6px; padding-top:10px; border-top:1px solid var(--border); font-size:16px; font-weight:700; color:var(--ink); }
  .partner-bar { display:flex; align-items:center; gap:10px; margin:0 0 18px; flex-wrap:wrap; }
  .partner-pills { display:flex; gap:8px; flex-wrap:wrap; }
  .partner-pill { background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:8px 16px; font-size:14px; font-weight:500; color:var(--ink); }

const DAY_MS = 24 * 60 * 60 * 1000;
const today = new Date(); today.setHours(0,0,0,0);

function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b) { return Math.round((b - a) / DAY_MS); }
function fmtDate(d) {
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }).replace('.', '');
}
// Fecha local (YYYY-MM-DD). toISOString() usa UTC y en España corre la fecha un día.
function toDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
// Interpreta importes escritos a la española: "1.800,50", "1.800", "12,5" o "12.5"
function parseAmount(s) {
  s = String(s == null ? '' : s).trim().replace(/\s/g, '').replace('€', '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return parseFloat(s);
}
const PERIOD_MONTHS = { mes: 1, trimestre: 3, anio: 12 };
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function addMonthsAnchored(date, months, anchorDay) {
  const first = new Date(date.getFullYear(), date.getMonth() + months, 1);
  const day = Math.min(anchorDay || date.getDate(), daysInMonth(first.getFullYear(), first.getMonth()));
  return new Date(first.getFullYear(), first.getMonth(), day);
}
// Próxima fecha de un pago que se repite. Siempre posterior a hoy, para no generar avisos atrasados en cadena.
function nextOccurrence(item) {
  const period = PERIOD_MONTHS[item.recurrence];
  const due = new Date(item.due_date + 'T00:00:00');
  const anchor = item.anchor_day || due.getDate();
  let n = addMonthsAnchored(due, period, anchor);
  let guard = 0;
  while (n <= today && guard++ < 240) n = addMonthsAnchored(n, period, anchor);
  return n;
}
// Lo pagado hace más de 45 días deja de mostrarse en las listas (el historial no se borra)
function isRecent(it) {
  if (!it.paid || !it.paid_on) return true;
  return daysBetween(new Date(it.paid_on + 'T00:00:00'), today) <= 45;
}

// ---- Vista por mes ----
function currentYm() { return toDateStr(today).slice(0, 7); }
function monthOptions() {
  const out = [];
  for (let i = -24; i <= 36; i++) out.push(toDateStr(new Date(today.getFullYear(), today.getMonth() + i, 1)).slice(0, 7));
  return out;
}
function monthLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  const name = new Date(y, m - 1, 1).toLocaleDateString('es-ES', { month: 'long' });
  return name.charAt(0).toUpperCase() + name.slice(1) + ' ' + y;
}
function monthPhrase(ym) { // "octubre de 2026"
  const [y, m] = ym.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
}
function changeMonth(ym) {
  state.viewMonth = ym; state.summaryFilter = null; state.activeTab = 'proximos'; state.notice = '';
  render();
}
function shiftMonth(delta) {
  const opts = monthOptions();
  const i = Math.min(opts.length - 1, Math.max(0, opts.indexOf(state.viewMonth) + delta));
  changeMonth(opts[i]);
}
// Fecha sugerida al añadir algo: dentro de una semana, o el mismo día en el mes que estás mirando
function defaultDate() {
  const ym = state.viewMonth;
  if (ym === currentYm()) return toDateStr(addDays(today, 7));
  const [y, m] = ym.split('-').map(Number);
  return toDateStr(new Date(y, m - 1, Math.min(today.getDate(), daysInMonth(y, m - 1))));
}
// Lo que se repetirá en un mes futuro: se proyecta desde el próximo pago de cada serie
function projectedFor(kind, ym) {
  if (ym <= currentYm()) return [];
  const out = [];
  state.items.filter(it => (it.kind || 'pago') === kind && !it.paid && it.recurrence && it.recurrence !== 'no').forEach(head => {
    const period = PERIOD_MONTHS[head.recurrence];
    const anchor = head.anchor_day || parseInt(head.due_date.slice(8, 10), 10);
    let n = new Date(head.due_date + 'T00:00:00');
    for (let i = 0; i < 600; i++) {
      n = addMonthsAnchored(n, period, anchor);
      const nym = toDateStr(n).slice(0, 7);
      if (nym > ym) break;
      if (nym === ym && n > today) out.push({ ...head, id: 'proj-' + head.id + '-' + toDateStr(n), due_date: toDateStr(n), projected: true });
    }
  });
  return out.sort((a, b) => a.due_date.localeCompare(b.due_date));
}
function fmtMoney(n) { return Number(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 4000);
}

function urgency(item) {
  const due = new Date(item.due_date + 'T00:00:00');
  const daysLeft = daysBetween(today, due);
  if (item.paid) {
    const paidOn = item.paid_on ? new Date(item.paid_on + 'T00:00:00') : today;
    const sincePaid = daysBetween(paidOn, today);
    return { level: 'green', daysLeft, sincePaid, label: 'Al día', due };
  }
  if (daysLeft <= 5) return { level: 'red', daysLeft, label: daysLeft < 0 ? 'Vencido' : daysLeft + ' días', due };
  if (daysLeft <= 10) return { level: 'orange', daysLeft, label: daysLeft + ' días', due };
  if (daysLeft <= 15) return { level: 'yellow', daysLeft, label: daysLeft + ' días', due };
  return { level: 'green', daysLeft, label: daysLeft + ' días', due };
}

function visibleInProximos(item) {
  const u = urgency(item);
  if (item.paid) return u.sincePaid <= 3;
  return u.daysLeft <= 15;
}

async function loadShared() {

  if (e1 || e2 || e3) { state.sharedError = (e1 || e2 || e3).message; state.partners = []; state.sharedExpenses = []; state.sharedParticipants = []; return; }
  state.sharedError = '';
  state.partners = partners || [];

  }

async function handleAvatarChange(e) {
  const file = e.target.files[0];
  if (!file) return;
  state.busy = true; state.profileMsg = ''; state.profileError = ''; render();

  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${state.session.user.id}/avatar.${ext}`;

  const { error: uploadError } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
  if (uploadError) {
    state.busy = false;
    state.profileError = 'No se pudo subir la foto: ' + uploadError.message;
    render();
    return;
  }

  const { data } = sb.storage.from('avatars').getPublicUrl(path);
  const avatar_url = data.publicUrl + '?t=' + Date.now(); // evita que quede una version vieja cacheada

  const { error: saveError } = await sb.from('profiles').upsert({
    id: state.session.user.id, avatar_url, phone: state.profile.phone || null
  });

  state.busy = false;
  if (saveError) {
    state.profileError = 'La foto se subió pero no se pudo guardar: ' + saveError.message;
    render();
    return;
  }

  state.profile.avatar_url = avatar_url;
  state.profileMsg = 'Foto actualizada.';
  render();
}

// Las personas de un espacio: siempre viven en shared_participants, cada una con su color.
function participantsOf(spaceId) {
  return state.sharedParticipants.filter(x => x.partner_id === spaceId);
}

// Saldo con cada persona del espacio (no entre ellas, solo entre vos y cada una), más el total.
// El reparto siempre es en partes iguales entre todos los presentes al momento del gasto.
function computeBalances(spaceId) {
  const people = participantsOf(spaceId);
  const N = people.length + 1; // vos + los demás
  const rows = state.sharedExpenses.filter(e => e.partner_id === spaceId);
  const perPerson = {};
  const perPersonLines = {}; // el detalle de gastos detrás de cada saldo, siempre calculado a partir de "rows"
  people.forEach(p => { perPerson[p.id] = 0; perPersonLines[p.id] = []; });
  rows.forEach(e => {
    if (e.paid_by === 'split') return; // cada uno puso su parte directo, no le debe nada a nadie
    const amount = Number(e.amount);
    const pct = (name) => e.shares && e.shares[name] != null ? Number(e.shares[name]) / 100 : 1 / N;
    if (e.paid_by === 'yo') {
      people.forEach(p => {
        const share = amount * pct(p.name);
        perPerson[p.id] += share; // cada uno te debe su parte
        perPersonLines[p.id].push({ id: e.id, description: e.description, amount: share, sign: 1, date: e.expense_date });
      });
    } else {
      const payer = people.find(p => p.name === e.paid_by);
      if (payer) {
        const share = amount * pct('yo');
        perPerson[payer.id] -= share; // vos le debés tu parte a quien pagó
        perPersonLines[payer.id].push({ id: e.id, description: e.description, amount: share, sign: -1, date: e.expense_date });
      }
    }
  });
  people.forEach(p => { perPersonLines[p.id].sort((a, b) => a.date.localeCompare(b.date)); });
  const total = Object.values(perPerson).reduce((a, b) => a + b, 0);
  return { people, N, rows, perPerson, perPersonLines, total };
}

function computeBudget(ym) {
  ym = ym || state.viewMonth;
  const pagos = state.items.filter(it => (it.kind || 'pago') === 'pago');
  // Cada pago que se repite tiene una sola fila sin pagar (la próxima), así que se cuenta una vez
  const recurring = pagos.filter(it => !it.paid && it.recurrence && it.recurrence !== 'no');
  const fixedList = recurring.filter(it => Number(it.amount) > 0)
    .map(it => ({ item: it, monthly: Number(it.amount) / PERIOD_MONTHS[it.recurrence] }));
  const fixedNoAmount = recurring.filter(it => !(Number(it.amount) > 0));
  const oneOffs = pagos.filter(it => (!it.recurrence || it.recurrence === 'no') && Number(it.amount) > 0 && it.due_date.slice(0, 7) === ym);
  const sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);
  const inMonth = (e) => !e.month || e.month === ym; // sin mes = todos los meses
  const incomes = state.entries.filter(e => e.type === 'ingreso' && inMonth(e));
  const variables = state.entries.filter(e => e.type === 'variable' && inMonth(e));
  const ahorros = state.entries.filter(e => e.type === 'ahorro' && inMonth(e));
  const ingresos = sum(incomes, e => Number(e.amount));
  const fijos = sum(fixedList, x => x.monthly);
  const puntuales = sum(oneOffs, it => Number(it.amount));
  const vars = sum(variables, e => Number(e.amount));
  const ahorro = sum(ahorros, e => Number(e.amount));
  const sobra = ingresos - fijos - puntuales - vars;
  return { incomes, variables, ahorros, fixedList, fixedNoAmount, oneOffs, ingresos, fijos, puntuales, vars, ahorro, sobra, libre: sobra - ahorro };
}

function renderMonthView() {
  const isTask = state.section === 'recordatorios';
  const kind = isTask ? 'tarea' : 'pago';
  const ym = state.viewMonth;
  const isPast = ym < currentYm();
  const todayStr = toDateStr(today);
  const real = state.items.filter(it => (it.kind || 'pago') === kind && it.due_date.slice(0, 7) === ym);
  const proj = projectedFor(kind, ym);
  const all = [...real, ...proj].sort((a, b) => a.due_date.localeCompare(b.due_date));
  const amt = (it) => Number(it.amount) || 0;
  const paidList = real.filter(it => it.paid);
  const pendingList = all.filter(it => !it.paid);
  const overdue = real.filter(it => !it.paid && it.due_date < todayStr);
  const sum = (arr) => arr.reduce((t, it) => t + amt(it), 0);
  const noAmt = isTask ? 0 : all.filter(it => !(amt(it) > 0)).length;
  const box = (label, value) => `<div class="summary-box static"><p class="label">${label}</p><p class="value">${value}</p></div>`;
  const boxes = isTask
    ? box('En el mes', all.length) + box('Hechos', paidList.length) + box('Pendientes', pendingList.length) + box('Vencidos', overdue.length)
    : box('Total del mes', fmtMoney(sum(all)) + ' €') + box('Pagado', fmtMoney(sum(paidList)) + ' €') + box(isPast ? 'Sin pagar' : 'Por pagar', fmtMoney(sum(pendingList)) + ' €') + box('Pagos', all.length);
  return `
  <div class="wrap-wide">
    ${renderTopBar()}
    <div class="summary-grid">${boxes}</div>
    <div class="list-header">
      <p>${isTask ? 'Recordatorios de ' : 'Pagos de '}${monthPhrase(ym)}</p>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost-sm" data-action="open-templates">Plantillas</button>
        <button class="btn-add" data-action="open-modal">+ Añadir</button>
      </div>
    </div>
    <div class="item-list">${all.length
      ? all.map(it => it.projected ? renderProjectedRow(it) : renderItemRow(it)).join('')
      : `<div class="empty-state"><p>${isTask ? 'No hay recordatorios en este mes.' : 'No hay pagos en este mes.'}</p></div>`}</div>
    ${proj.length ? '<p style="font-size:12px;color:var(--muted);margin-top:12px;">Lo marcado como "Previsto" se crea solo cuando completas el anterior. Para cambiarlo, edita el actual.</p>' : ''}
    ${noAmt ? `<p style="font-size:12px;color:var(--muted);margin-top:6px;">${noAmt} pago${noAmt === 1 ? ' no tiene importe y no suma' : 's no tienen importe y no suman'} en el total.</p>` : ''}
  </div>
  ${state.modalOpen ? renderModal() : ''}
  ${state.templatesOpen ? renderTemplates() : ''}`;
}

function renderBudget() {
  if (state.entriesError) {
    return `<div class="card"><p class="sub" style="margin:0;">No se pudo cargar el presupuesto (${esc(state.entriesError)}). Falta ejecutar el SQL de presupuesto en Supabase.</p></div>`;
  }
  const ym = state.viewMonth, cur = currentYm();
  const b = computeBudget(ym);
  const hasIncome = b.ingresos > 0;
  const total = Math.max(b.ingresos, b.fijos + b.puntuales + b.vars, 1);
  const w = (v) => Math.max(0, v / total * 100).toFixed(2) + '%';
  const neg = b.sobra < 0;
  const mo = (v) => fmtMoney(v) + ' €';
  const sobraPos = Math.max(0, b.sobra);
  const ahorroSeg = Math.min(b.ahorro, sobraPos);
  const libreSeg = Math.max(0, sobraPos - b.ahorro);
  const btns = (id) => `<button class="icon-action-btn" data-action="open-entry" data-id="${id}" title="Editar" aria-label="Editar">✏️</button><button class="icon-action-btn" data-action="delete-entry" data-id="${id}" title="Eliminar" aria-label="Eliminar">🗑️</button>`;
  const entryRow = (e, sub) => { const s = sub || (e.month ? 'Solo este mes' : ''); return `<div class="bud-row"><div class="name">${esc(e.name)}${s ? `<span class="sub2">${s}</span>` : ''}</div><div class="amt">${mo(e.amount)}</div>${btns(e.id)}</div>`; };
  const head = (title, totalTxt, type, label) => `<div class="bud-card-head"><div><h3>${title}</h3>${totalTxt ? `<span class="bud-total">${totalTxt}</span>` : ''}</div>${type ? `<button class="btn-ghost-sm" data-action="open-entry" data-type="${type}">${label}</button>` : ''}</div>`;
  const nNoAmt = b.fixedNoAmount.length;
  const libreNeg = b.libre < 0;
  const titulo = libreNeg ? (ym === cur ? 'Te faltan este mes' : 'Te faltan en ' + monthPhrase(ym)) : (ym === cur ? 'Tienes libre este mes' : 'Tienes libre en ' + monthPhrase(ym));
  let subMsg;
  if (!hasIncome) subMsg = 'Empieza cargando lo que te entra al mes; con tus pagos calculamos el resto.';
  else if (!libreNeg) subMsg = 'Es el ' + Math.round(b.libre / b.ingresos * 100) + ' % de lo que te entra, ya reservando tu ahorro.';
  else if (b.sobra >= 0) subMsg = 'Lo que reservaste para ahorrar es mayor a lo que te sobra.';
  else subMsg = 'Tus gastos superan tus ingresos, antes de contar el ahorro.';
  const receiptRow = (label, val, cls) => val ? `<div class="receipt-row ${cls || ''}"><span>${label}</span><span>${val < 0 ? '−' : ''}${mo(Math.abs(val))}</span></div>` : '';

  return `
  <div class="card">
    <p class="sub" style="margin:0 0 4px;">${titulo}</p>
    <p class="bud-big" style="${libreNeg ? 'color:var(--danger-ink);' : ''}">${mo(Math.abs(b.libre))}</p>
    <p class="sub" style="margin:0;">${subMsg}</p>
    <div class="bud-bar">
      <span class="seg-fijo" style="width:${w(b.fijos)}"></span>
      <span class="seg-punt" style="width:${w(b.puntuales)}"></span>
      <span class="seg-var" style="width:${w(b.vars)}"></span>
      <span class="seg-ahorro" style="width:${w(ahorroSeg)}"></span>
      <span class="seg-sobra" style="width:${w(libreSeg)}"></span>
    </div>
    ${hasIncome ? `<div class="receipt">
      ${receiptRow('Ingresos', b.ingresos)}
      ${receiptRow('Gastos fijos', -b.fijos)}
      ${receiptRow('Pagos puntuales', -b.puntuales)}
      ${receiptRow('Gastos variables', -b.vars)}
      ${receiptRow('Ahorro', -b.ahorro)}
      <div class="receipt-row receipt-total" style="${libreNeg ? 'color:var(--danger-ink);' : ''}"><span>${libreNeg ? 'Te falta' : 'Libre para gastar'}</span><span>${mo(Math.abs(b.libre))}</span></div>
    </div>` : ''}
    ${ym !== cur ? '<p class="sub" style="margin:10px 0 0;font-size:12px;">Los gastos fijos son una estimación mensual. Los pagos puntuales, y lo marcado como "solo este mes", son los de ese mes.</p>' : ''}
  </div>

  <div class="card">
    ${head('Ingresos', hasIncome ? mo(b.ingresos) + ' en el mes' : '', 'ingreso', '+ Añadir')}
    ${b.incomes.length ? `<div>${b.incomes.map(e => entryRow(e)).join('')}</div>` : '<p class="sub" style="margin:8px 0 0;">Añade tu sueldo y cualquier otro ingreso.</p>'}
  </div>

  <div class="card">
    ${head('Gastos fijos', mo(b.fijos) + ' al mes', '', '')}
    <p class="sub" style="margin:0 0 6px;">Salen de tus <strong>Pagos que se repiten</strong>, calculados por mes. Para cambiarlos, edítalos en la pestaña Gastos.</p>
    ${b.fixedList.length ? `<div>${b.fixedList.map(({ item, monthly }) => `<div class="bud-row"><div class="name">${esc(item.name)}<span class="sub2">${fmtMoney(item.amount)} € ${RECURRENCE_LABEL[item.recurrence]}${item.recurrence !== 'mes' ? ' · ' + fmtMoney(monthly) + ' € al mes' : ''}</span></div><div class="amt">${mo(monthly)}</div></div>`).join('')}</div>` : '<p class="sub" style="margin:8px 0 0;">Todavía no tienes pagos que se repitan con importe. Añádelos en la pestaña Gastos.</p>'}
    ${nNoAmt ? `<p class="sub" style="margin:10px 0 0;color:var(--orange-ink);">${nNoAmt} pago${nNoAmt === 1 ? ' que se repite no tiene importe y no se cuenta' : 's que se repiten no tienen importe y no se cuentan'}: ${b.fixedNoAmount.map(it => esc(it.name)).join(', ')}. Añádelo${nNoAmt === 1 ? '' : 's'} con el lápiz ✏️ en Pagos.</p>` : ''}
  </div>

  ${b.oneOffs.length ? `<div class="card">
    ${head('Pagos puntuales de ' + monthPhrase(ym), mo(b.puntuales), '', '')}
    <div>${b.oneOffs.map(it => `<div class="bud-row"><div class="name">${esc(it.name)}<span class="sub2">Vence el ${fmtDate(new Date(it.due_date + 'T00:00:00'))}</span></div><div class="amt">${mo(it.amount)}</div></div>`).join('')}</div>
  </div>` : ''}

  <div class="card">
    ${head('Gastos variables', b.vars > 0 ? mo(b.vars) + ' en el mes' : '', 'variable', '+ Añadir')}
    <p class="sub" style="margin:0 0 6px;">Estima cuánto gastas al mes en cada cosa: comida, transporte, ocio...</p>
    ${b.variables.length ? `<div>${b.variables.map(e => entryRow(e)).join('')}</div>` : ''}
  </div>

  <div class="card">
    ${head('Ahorro mensual', b.ahorro > 0 ? mo(b.ahorro) + ' en el mes' : '', 'ahorro', '+ Añadir')}
    <p class="sub" style="margin:0 0 6px;">Reparte lo que te sobra: por ejemplo, 50 € para un viaje y 100 € para imprevistos.</p>
    ${b.ahorros.length ? `<div>${b.ahorros.map(e => entryRow(e, e.month ? 'Solo este mes' : mo(Number(e.amount) * 12) + ' en un año')).join('')}</div>` : ''}
    ${b.ahorros.length ? `<p class="sub" style="margin:12px 0 0;">Reservas ${mo(b.ahorro)} al mes${hasIncome ? ' (el ' + Math.round(b.ahorro / b.ingresos * 100) + ' % de lo que te entra)' : ''}. Ya está descontado de lo que ves arriba como "Libre para gastar".</p>` : ''}
  </div>

  <p class="sub" style="font-size:12px;">Cálculos orientativos a partir de lo que has cargado. No son asesoramiento financiero.</p>`;
}

function renderApp() {
  if (state.section === 'presupuesto') return renderBudgetScreen();
  if (state.section === 'compartido') return renderSharedScreen();
  if (state.viewMonth !== currentYm()) return renderMonthView();
  const isTask = state.section === 'recordatorios';
  const T = (a, b) => (isTask ? a : b);
  const items = state.items.filter(it => (it.kind || 'pago') === (isTask ? 'tarea' : 'pago'));
  const dl = (it) => daysBetween(today, new Date(it.due_date + 'T00:00:00'));
  const unpaid = items.filter(it => !it.paid);
  const overdueItems = unpaid.filter(it => dl(it) < 0);
  const recent = items.filter(isRecent);
  const ym = toDateStr(today).slice(0, 7);
  const paidThisMonth = items.filter(it => it.paid && it.paid_on && it.paid_on.slice(0, 7) === ym);
  const paidItems = isTask ? recent.filter(it => it.paid) : paidThisMonth;
  const todayItems = unpaid.filter(it => dl(it) === 0);
  const weekItems = unpaid.filter(it => dl(it) >= 0 && dl(it) <= 7);
  const nextItem = [...unpaid].sort((a, b) => new Date(a.due_date) - new Date(b.due_date))[0];
  const nextDays = nextItem ? dl(nextItem) : null;
  const endOfMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  const paidMonth = paidThisMonth.reduce((sum, it) => sum + (Number(it.amount) || 0), 0);
  const pendingMonth = unpaid.filter(it => new Date(it.due_date + 'T00:00:00') <= endOfMonth).reduce((sum, it) => sum + (Number(it.amount) || 0), 0);
  const totalMonth = paidMonth + pendingMonth;

  const F = state.summaryFilter;
  let list, listTitle, emptyMsg, footNote = '', grouped = false;
  if (F === 'paid') {
    list = paidItems; listTitle = T('Hechos', 'Pagado este mes');
    emptyMsg = T('Todavía no marcaste nada como hecho.', 'Todavía no marcaste nada como pagado.');
  } else if (F === 'next') {
    list = nextItem ? [nextItem] : []; listTitle = 'Tu próximo vencimiento'; emptyMsg = 'No tienes nada pendiente.';
  } else if (F === 'active') {
    list = recent.slice(); listTitle = 'Todos tus ítems activos'; emptyMsg = 'Todavía no cargaste nada.';
  } else if (F === 'overdue') {
    list = overdueItems; listTitle = T('Recordatorios vencidos', 'Ítems vencidos'); emptyMsg = 'No tienes nada vencido. Bien ahí.';
  } else if (F === 'today') {
    list = todayItems; listTitle = 'Para hoy'; emptyMsg = 'No tienes nada para hoy.';
  } else if (F === 'week') {
    list = weekItems; listTitle = 'Próximos 7 días'; emptyMsg = 'No tienes nada en los próximos 7 días.';
  } else {
    list = items.filter(it => state.activeTab === 'todo' ? isRecent(it) : visibleInProximos(it));
    listTitle = state.activeTab === 'todo' ? 'Todo lo que tienes cargado' : T('Tus recordatorios', 'Tus pagos y fechas');
    emptyMsg = state.activeTab === 'todo' ? 'Todavía no cargaste nada.' : 'No tienes nada urgente por ahora.';
    grouped = isTask;
    if (state.activeTab === 'todo') footNote = '<p style="font-size:12px;color:var(--muted);margin-top:12px;">Aquí aparece todo, esté cerca o lejos. En "Próximos" solo se muestra lo que está dentro de los 15 días, o recién completado. Lo completado hace más de 45 días se oculta.</p>';
  }

  const sf = (name) => state.summaryFilter === name ? 'is-active' : '';
  const listHtml = list.length
    ? (grouped ? renderTaskGroups(list) : list.map(renderItemRow).join(''))
    : `<div class="empty-state"><p>${emptyMsg}</p></div>`;

  const boxes = isTask ? `
      <button type="button" class="summary-box ${sf('today')}" data-action="filter-today"><p class="label">Para hoy</p><p class="value">${todayItems.length}</p></button>
      <button type="button" class="summary-box ${sf('week')}" data-action="filter-week"><p class="label">Próximos 7 días</p><p class="value">${weekItems.length}</p></button>
      <button type="button" class="summary-box ${sf('overdue')}" data-action="filter-overdue"><p class="label">Vencidos</p><p class="value">${overdueItems.length}</p></button>
      <button type="button" class="summary-box ${sf('paid')}" data-action="filter-paid"><p class="label">Hechos</p><p class="value">${paidItems.length} <span class="of">de ${recent.length}</span></p></button>`
    : `
      <button type="button" class="summary-box ${sf('paid')}" data-action="filter-paid"><p class="label">Pagado este mes</p><p class="value">${fmtMoney(paidMonth)} € <span class="of">de ${fmtMoney(totalMonth)} €</span></p></button>
      <button type="button" class="summary-box ${sf('next')}" data-action="filter-next"><p class="label">Próximo vencimiento</p><p class="value">${nextDays !== null ? nextDays + ' días' : '—'}</p></button>
      <button type="button" class="summary-box ${sf('active')}" data-action="filter-active"><p class="label">Ítems activos</p><p class="value">${recent.length}</p></button>
      <button type="button" class="summary-box ${sf('overdue')}" data-action="filter-overdue"><p class="label">Ítems vencidos</p><p class="value">${overdueItems.length}</p></button>`;

  return `
  <div class="wrap-wide">
    ${renderTopBar()}

    <div class="summary-grid">${boxes}
    </div>

    <div class="tabs">
      <button class="${!state.summaryFilter && state.activeTab==='proximos'?'active':''}" data-action="tab-proximos">Próximos</button>
      <button class="${!state.summaryFilter && state.activeTab==='todo'?'active':''}" data-action="tab-todo">Ver todo</button>
    </div>

    <div class="list-header">
      <p>${listTitle}</p>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost-sm" data-action="open-templates">Plantillas</button>
        <button class="btn-add" data-action="open-modal">+ Añadir</button>
      </div>
    </div>

    <div class="item-list">${listHtml}</div>

    ${footNote}
  </div>
  ${state.modalOpen ? renderModal() : ''}
  ${state.templatesOpen ? renderTemplates() : ''}
  `;
}

function renderTaskGroups(list) {
  const dl = (it) => daysBetween(today, new Date(it.due_date + 'T00:00:00'));
  const groups = [
    ['Vencidos', it => !it.paid && dl(it) < 0],
    ['Hoy', it => !it.paid && dl(it) === 0],
    ['Próximos 7 días', it => !it.paid && dl(it) >= 1 && dl(it) <= 7],
    ['Más adelante', it => !it.paid && dl(it) > 7],
    ['Hechos', it => it.paid],
  ];
  return groups.map(([title, fn]) => {
    const rows = list.filter(fn);
    return rows.length ? `<p class="group-title">${title}</p>` + rows.map(renderItemRow).join('') : '';
  }).join('');
}

function renderTemplates() {
  const isTask = state.section === 'recordatorios';
  const listKey = isTask ? 'tareas' : 'pagos';
  const pack = state.templatePack ? TEMPLATE_PACKS[state.templatePack] : null;
