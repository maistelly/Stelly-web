 cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(216)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(288)"/><circle r="3.2" fill="%23E8C767" fill-opacity="0.4"/><path d="M -3,14 C -10,10 -14,18 -9,24 C -6,19 -4,17 -3,14 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><path d="M 3,16 C 10,13 15,20 10,27 C 6,22 4,19 3,16 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><line x1="0" y1="10" x2="0" y2="26" stroke="%237C8F5D" stroke-opacity="0.24" stroke-width="0.8"/></g><g transform="translate(150,230) rotate(50) scale(0.65)"><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(0)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(72)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(144)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(216)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(288)"/><circle r="3.2" fill="%23E8C767" fill-opacity="0.4"/><path d="M -3,14 C -10,10 -14,18 -9,24 C -6,19 -4,17 -3,14 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><path d="M 3,16 C 10,13 15,20 10,27 C 6,22 4,19 3,16 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><line x1="0" y1="10" x2="0" y2="26" stroke="%237C8F5D" stroke-opacity="0.24" stroke-width="0.8"/></g><g transform="translate(280,260) rotate(-10) scale(0.45)"><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(0)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(72)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(144)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(216)"/><ellipse cx="0" cy="-10" rx="4.6" ry="10" fill="%23FFFFFF" fill-opacity="0.4" stroke="%23C9B98C" stroke-opacity="0.3" stroke-width="1" transform="rotate(288)"/><circle r="3.2" fill="%23E8C767" fill-opacity="0.4"/><path d="M -3,14 C -10,10 -14,18 -9,24 C -6,19 -4,17 -3,14 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><path d="M 3,16 C 10,13 15,20 10,27 C 6,22 4,19 3,16 Z" fill="%238FA772" fill-opacity="0.28" stroke="%237C8F5D" stroke-opacity="0.3" stroke-width="0.5"/><line x1="0" y1="10" x2="0" y2="26" stroke="%237C8F5D" stroke-opacity="0.24" stroke-width="0.8"/></g></svg>');
    background-repeat: repeat;

  input, select, button { font-family: inherit; font-size: 15px; }
  input, select {
    background: var(--surface); border: 1px solid var(--border); color: var(--ink);
    border-radius: 10px; padding: 10px 12px; width: 100%;
  }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  button { cursor: pointer; }
  .btn-primary {
    background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 10px; padding: 13px 18px; font-size: 15px; font-weight: 600; width: 100%;
  }
  .btn-primary:hover { opacity: 0.92; }
  .btn-ghost {
    background: transparent; border: none; color: var(--muted); font-size: 14px; padding: 8px;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 28px 20px 60px; }
  .wrap-wide { max-width: 720px; margin: 0 auto; padding: 24px 20px 80px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px; margin-bottom: 14px;
  }
  .steps { display: flex; gap: 6px; justify-content: center; margin-bottom: 28px; }
  .steps span { width: 26px; height: 4px; border-radius: 2px; background: var(--border); }
  .steps span.done { background: var(--accent); }
  h1.brand { font-size: 15px; font-weight: 700; text-align: center; margin: 0 0 30px; letter-spacing: 0.01em; }
  h2.title { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  p.sub { font-size: 14px; color: var(--muted); margin: 0 0 20px; }
  label.field-label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 5px; }
  .field { margin-bottom: 14px; }
  .price-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 16px; }
  .price-row .amount { font-size: 32px; font-weight: 700; }
  .price-row .period { font-size: 14px; color: var(--muted); }
  ul.feat { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-direction: column; gap: 8px; }
  ul.feat li { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .chan-option {
    display: flex; align-items: center; gap: 10px; font-size: 14px;
    background: var(--surface-2); padding: 12px; border-radius: 12px; margin-bottom: 8px;
  }
  .chan-option input { width: auto; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hidden { display: none !important; }

  /* app screen */
  header.app-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
  }
  header.app-header .brand-name { font-weight: 700; font-size: 16px; }
  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
  @media (min-width: 560px) { .summary-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 559px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
  .summary-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; cursor: pointer; text-align: left; font-family: inherit; }
  .summary-box.is-active { border-color: var(--accent); background: var(--surface-2); }
  .summary-box .label { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .summary-box .value { font-size: 21px; font-weight: 700; margin: 0; }
  .value .of { font-size: 13px; color: var(--muted); font-weight: 400; }
  .tabs { display: inline-flex; gap: 4px; background: var(--surface-2); border-radius: 11px; padding: 4px; margin-bottom: 18px; }
  .tabs button {
    background: transparent; border: none; color: var(--muted); padding: 7px 16px;
    border-radius: 8px; font-size: 14px;
  }
  .tabs button.active { background: var(--surface); color: var(--ink); font-weight: 600; }
  .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .list-header p { font-size: 16px; font-weight: 600; margin: 0; }
  .btn-add {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 10px;
    padding: 9px 15px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px;
  }
  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item-row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px;
  }
  .item-row.is-paid { opacity: 0.62; }
  .icon-badge {
    width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; font-size: 18px;
  }
  .item-mid { flex: 1; min-width: 0; }
  .item-mid .name { font-size: 14px; font-weight: 600; margin: 0; }
  .item-mid .meta { font-size: 12px; color: var(--muted); margin: 3px 0 0; }
  .item-badge-col { text-align: right; flex-shrink: 0; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px; white-space: nowrap; display: inline-block;
  }
  .date-sub { font-size: 11px; color: var(--muted); margin: 4px 0 0; }
  .chan-icons { display: flex; gap: 6px; flex-shrink: 0; color: var(--muted); font-size: 15px; }
  .mark-paid-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; flex-shrink: 0;
  }
  .mark-paid-btn.is-done {
    background: var(--green-bg); border-color: transparent; color: var(--green-ink); font-weight: 600;
  }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
  .empty-state p { margin: 0 0 16px; font-size: 14px; }

  /* modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.42); display: flex;
    align-items: flex-end; justify-content: center; z-index: 50;
  }
  @media (min-width: 560px) { .modal-backdrop { align-items: center; } }
  .modal-box {
    background: var(--surface); border-radius: 20px 20px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto;
  }
  @media (min-width: 560px) { .modal-box { border-radius: 20px; } }
  .modal-title { font-size: 17px; font-weight: 700; margin: 0 0 16px; }
  .toast {
    position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);

    z-index: 60; max-width: 90vw; text-align: center;
  }
  .auth-tabs { display: flex; gap: 4px; background: var(--surface-2); border-radius: 11px; padding: 4px; margin-bottom: 18px; }
  .auth-tabs button { flex: 1; background: transparent; border: none; color: var(--muted); padding: 8px; border-radius: 8px; font-size: 14px; }
  .auth-tabs button.active { background: var(--surface); color: var(--ink); font-weight: 600; }
  .btn-primary[disabled] { opacity: 0.6; cursor: default; }
  .signout-link { font-size: 13px; color: var(--muted); background: none; border: none; }
  .icon-action-btn { background: transparent; border: none; font-size: 15px; padding: 4px 6px; flex-shrink: 0; opacity: 0.75; }
  .icon-action-btn:hover { opacity: 1; }
  .demo-tag {
    position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-size: 11px; padding: 6px 12px; border-radius: 20px;
    opacity: 0.78; z-index: 40; white-space: nowrap;
  }
</style>

<body>

<div id="root"></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://kzquynnxjwieppeptvom.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VvUAndvtmXDnmQrfyhIzKA_lBay7hTn';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DAY_MS = 24 * 60 * 60 * 1000;
const today = new Date(); today.setHours(0,0,0,0);

function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b) { return Math.round((b - a) / DAY_MS); }
function fmtDate(d) {
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }).replace('.', '');
}
function toDateStr(d) { return d.toISOString().slice(0,10); }
function fmtMoney(n) { return Number(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 4000);
}

let state = {
  screen: 'loading', // loading, plan, auth, channels, app
  authMode: 'signup',
  session: null,
  items: [],
  activeTab: 'proximos',
  modalOpen: false,
  editingItem: null,
  summaryFilter: null, // null, 'paid', 'next', 'active', 'overdue'
  busy: false,
  authError: '',
  confirmMsg: '',
  profile: { phone: '', avatar_url: '' },
  profileMsg: '',
  profileError: '',
};

function urgency(item) {
  const due = new Date(item.due_date + 'T00:00:00');
  const daysLeft = daysBetween(today, due);
  if (item.paid) {
    const paidOn = item.paid_on ? new Date(item.paid_on + 'T00:00:00') : today;
    const sincePaid = daysBetween(paidOn, today);
    return { level: 'green', daysLeft, sincePaid, label: 'Al día', due };
  }
  if (daysLeft <= 5) return { level: 'red', daysLeft, label: daysLeft < 0 ? 'Vencido' : daysLeft + ' días', due };
  if (daysLeft <= 10) return { level: 'orange', daysLeft, label: daysLeft + ' días', due };
  if (daysLeft <= 15) return { level: 'yellow', daysLeft, label: daysLeft + ' días', due };
  return { level: 'green', daysLeft, label: daysLeft + ' días', due };
}

function visibleInProximos(item) {
  const u = urgency(item);
  if (item.paid) return u.sincePaid <= 3;
  return u.daysLeft <= 15;
}

async function loadItems() {
  const { data, error } = await sb.from('items').select('*').order('due_date', { ascending: true });
  if (error) { showToast('No se pudieron cargar los datos: ' + error.message); return; }
  state.items = data || [];
  render();
}

async function loadProfile() {
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
  if (!error && data) {
    state.profile = { phone: data.phone || '', avatar_url: data.avatar_url || '' };
  }
  render();
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    state.session = session;
    state.screen = 'app';
    render();
    await loadItems();
  } else {
    state.screen = 'plan';
    render();
  }
}

function render() {
  document.body.className = (state.screen === 'app') ? '' : 'has-bloom';
  const root = document.getElementById('root');
  if (state.screen === 'loading') root.innerHTML = '<div class="wrap"><p class="sub" style="text-align:center;margin-top:60px;">Cargando…</p></div>';
  else if (state.screen === 'plan') root.innerHTML = renderPlan();
  else if (state.screen === 'auth') root.innerHTML = renderAuth();
  else if (state.screen === 'channels') root.innerHTML = renderChannels();
  else if (state.screen === 'profile') root.innerHTML = renderProfile();
  else root.innerHTML = renderApp();
  attachHandlers();
}

function stepsHtml(step) {
  let s = '<div class="steps">';
  for (let i = 1; i <= 3; i++) s += `<span class="${i <= step ? 'done' : ''}"></span>`;
  return s + '</div>';
}

const BRAND_H1 = '<h1 class="brand"><svg class="jasmine-icon" viewBox="0 0 40 40" aria-hidden="true"><g><ellipse cx="20" cy="10" rx="6.5" ry="9" fill="#FFFDF7" stroke="#B99B5B" stroke-width="1.3"/><ellipse cx="20" cy="10" rx="6.5" ry="9" fill="#FFFDF7" stroke="#B99B5B" stroke-width="1.3" transform="rotate(72 20 20)"/><ellipse cx="20" cy="10" rx="6.5" ry="9" fill="#FFFDF7" stroke="#B99B5B" stroke-width="1.3" transform="rotate(144 20 20)"/><ellipse cx="20" cy="10" rx="6.5" ry="9" fill="#FFFDF7" stroke="#B99B5B" stroke-width="1.3" transform="rotate(216 20 20)"/><ellipse cx="20" cy="10" rx="6.5" ry="9" fill="#FFFDF7" stroke="#B99B5B" stroke-width="1.3" transform="rotate(288 20 20)"/><circle cx="20" cy="20" r="4.2" fill="#E8C767" stroke="#B99B5B" stroke-width="0.6"/></g></svg>STELLY</h1>';

function renderPlan() {
  return `
  <div class="wrap">
    ${BRAND_H1}
    ${stepsHtml(1)}
    <div class="card">
      <h2 class="title">Un plan único, simple</h2>
      <p class="sub">Empieza a organizarte desde el primer día.</p>
      <div class="price-row"><span class="amount">6 €</span><span class="period">por mes</span></div>
      <ul class="feat">
        <li><span class="dot"></span>Ítems ilimitados: suscripciones, alquiler, fechas fiscales, lo que sea</li>
        <li><span class="dot"></span>Avisos por WhatsApp y mail</li>
        <li><span class="dot"></span>Cancelas cuando quieras, sin permanencia</li>
      </ul>
      <p class="sub" style="margin-bottom:16px;">El cobro todavía no está activado mientras probamos. Por ahora es gratis mientras validamos la idea.</p>
      <button class="btn-primary" data-action="go-auth">Continuar</button>
    </div>
  </div>`;
}

function renderAuth() {
  const isSignup = state.authMode === 'signup';
  return `
  <div class="wrap">
    ${BRAND_H1}
    ${stepsHtml(2)}
    <div class="card">
      <div class="auth-tabs">
        <button class="${isSignup ? 'active' : ''}" data-action="auth-mode-signup">Crear cuenta</button>
        <button class="${!isSignup ? 'active' : ''}" data-action="auth-mode-signin">Ya tengo cuenta</button>
      </div>
      <h2 class="title">${isSignup ? 'Crea tu cuenta' : 'Inicia sesión'}</h2>
      <p class="sub">${isSignup ? 'Un minuto y ya podés cargar tu primer pago' : 'Entrá con tu mail y contraseña'}</p>
      ${state.confirmMsg ? `<p class="sub" style="color:var(--green-ink);background:var(--green-bg);padding:10px 12px;border-radius:10px;">${state.confirmMsg}</p>` : ''}
      ${state.authError ? `<p class="sub" style="color:var(--danger-ink);background:var(--danger-bg);padding:10px 12px;border-radius:10px;">${state.authError}</p>` : ''}
      <div class="field"><label class="field-label">Email</label><input id="auth-email" type="email" placeholder="tu@email.com"></div>
      <div class="field"><label class="field-label">Contraseña</label><input id="auth-password" type="password" placeholder="********"></div>
      <button class="btn-primary" data-action="${isSignup ? 'do-signup' : 'do-signin'}" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Un momento…' : 'Continuar'}</button>
    </div>
    <button class="btn-ghost" data-action="go-plan">← Volver</button>
  </div>`;
}

function renderChannels() {
  return `
  <div class="wrap">
    ${BRAND_H1}
    ${stepsHtml(3)}
    <div class="card">
      <h2 class="title">¿Cómo quieres que te avisemos?</h2>
      <p class="sub">Podés agregar tu número ahora o más adelante desde la app</p>
      <div class="field"><label class="field-label">Tu número (para WhatsApp, opcional)</label><input id="channels-phone" type="tel" placeholder="+34 600 000 000"></div>
      <button class="btn-primary" data-action="save-channels" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Un momento…' : 'Empezar a usar Stelly'}</button>
    </div>
  </div>`;
}

function renderProfile() {
  const email = state.session?.user?.email || '';
  const initial = email.charAt(0).toUpperCase() || '?';
  const avatarHtml = state.profile.avatar_url
    ? `<img src="${state.profile.avatar_url}" alt="Foto de perfil" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:1px solid var(--border);">`
    : `<div style="width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:600;">${initial}</div>`;

  return `
  <div class="wrap-wide" style="max-width:560px;">
    <header class="app-header">
      <span class="brand-name">Mi perfil</span>
      <button class="signout-link" data-action="go-app-from-profile">← Volver</button>
    </header>

    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:18px;">
        ${avatarHtml}
        <div>
          <p style="font-weight:600;margin:0;">${email}</p>
          <p class="sub" style="margin:2px 0 0;">Tu cuenta en Stelly</p>
        </div>
      </div>

      ${state.profileMsg ? `<p class="sub" style="color:var(--green-ink);background:var(--green-bg);padding:10px 12px;border-radius:10px;">${state.profileMsg}</p>` : ''}
      ${state.profileError ? `<p class="sub" style="color:var(--danger-ink);background:var(--danger-bg);padding:10px 12px;border-radius:10px;">${state.profileError}</p>` : ''}

      <div class="field">
        <label class="field-label">Foto de perfil (link a una imagen)</label>
        <input id="profile-avatar" type="text" placeholder="https://..." value="${state.profile.avatar_url}">
      </div>
      <div class="field">
        <label class="field-label">WhatsApp</label>
        <input id="profile-phone" type="tel" placeholder="+34 600 000 000" value="${state.profile.phone}">
      </div>
      <button class="btn-primary" data-action="save-profile" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Guardando…' : 'Guardar cambios'}</button>
    </div>

    <div class="card">
      <p class="modal-title" style="margin-bottom:4px;">Cambiar contraseña</p>
      <p class="sub" style="margin-bottom:16px;">Dejá estos campos vacíos si no querés cambiarla.</p>
      <div class="field">
        <label class="field-label">Contraseña nueva</label>
        <input id="profile-new-password" type="password" placeholder="********">
      </div>
      <div class="field">
        <label class="field-label">Repetir contraseña nueva</label>
        <input id="profile-new-password-2" type="password" placeholder="********">
      </div>
      <button class="btn-primary" data-action="update-password" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Guardando…' : 'Actualizar contraseña'}</button>
    </div>
  </div>`;
}

function renderApp() {
  const unpaid = state.items.filter(it => !it.paid);
  const overdueItems = unpaid.filter(it => daysBetween(today, new Date(it.due_date + 'T00:00:00')) < 0);
  const paidItems = state.items.filter(it => it.paid);
  const nextItem = [...unpaid].sort((a,b) => new Date(a.due_date) - new Date(b.due_date))[0];
  const nextDays = nextItem ? daysBetween(today, new Date(nextItem.due_date + 'T00:00:00')) : null;

  const totalMonth = state.items.reduce((sum, it) => sum + (Number(it.amount) || 0), 0);
  const paidMonth = paidItems.reduce((sum, it) => sum + (Number(it.amount) || 0), 0);

  let list, listTitle, emptyMsg, footNote = '';
  if (state.summaryFilter === 'paid') {
    list = paidItems; listTitle = 'Pagado este mes'; emptyMsg = 'Todavía no marcaste nada como pagado.';
  } else if (state.summaryFilter === 'next') {
    list = nextItem ? [nextItem] : []; listTitle = 'Tu próximo vencimiento'; emptyMsg = 'No tienes nada pendiente.';
  } else if (state.summaryFilter === 'active') {
    list = state.items.slice(); listTitle = 'Todos tus ítems activos'; emptyMsg = 'Todavía no cargaste nada.';
  } else if (state.summaryFilter === 'overdue') {
    list = overdueItems; listTitle = 'Ítems vencidos'; emptyMsg = 'No tienes nada vencido. Bien ahí.';
  } else {
    list = state.items.filter(it => state.activeTab === 'todo' ? true : visibleInProximos(it));
    listTitle = state.activeTab === 'todo' ? 'Todo lo que tienes cargado' : 'Tus pagos y fechas';
    emptyMsg = state.activeTab === 'todo' ? 'Todavía no cargaste nada.' : 'No tienes nada urgente por ahora.';
    if (state.activeTab === 'todo') footNote = '<p style="font-size:12px;color:var(--muted);margin-top:12px;">Aquí aparece todo, esté cerca o lejos. En "Próximos" solo se muestra lo que está dentro de los 15 días, o recién pagado.</p>';
  }

  const sf = (name) => state.summaryFilter === name ? 'is-active' : '';

  return `
  <div class="wrap-wide">
    <header class="app-header">
      <span class="brand-name"><svg class="jasmine-icon jasmine-icon-sm" viewBox="0 0 40 40" aria-hidden="true"><g><ellipse cx="20" cy="10" rx="6.5" ry="9" fill="#FFFDF7" stroke="#B99B5B" stroke-width="1.3"/><ellipse cx="20" cy="10" rx="6.5" ry="9" fill="#FFFDF7" stroke="#B99B5B" stroke-width="1.3" transform="rotate(72 20 20)"/><ellipse cx="20" cy="10" rx="6.5" ry="9" fill="#FFFDF7" stroke="#B99B5B" stroke-width="1.3" transform="rotate(144 20 20)"/><ellipse cx="20" cy="10" rx="6.5" ry="9" fill="#FFFDF7" stroke="#B99B5B" stroke-width="1.3" transform="rotate(216 20 20)"/><ellipse cx="20" cy="10" rx="6.5" ry="9" fill="#FFFDF7" stroke="#B99B5B" stroke-width="1.3" transform="rotate(288 20 20)"/><circle cx="20" cy="20" r="4.2" fill="#E8C767" stroke="#B99B5B" stroke-width="0.6"/></g></svg>STELLY</span>
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="signout-link" data-action="go-profile">Mi perfil</button>
        <button class="signout-link" data-action="sign-out">Cerrar sesión</button>
      </div>
    </header>

    <div class="summary-grid">
      <button type="button" class="summary-box ${sf('paid')}" data-action="filter-paid"><p class="label">Pagado este mes</p><p class="value">${fmtMoney(paidMonth)} € <span class="of">de ${fmtMoney(totalMonth)} €</span></p></button>
      <button type="button" class="summary-box ${sf('next')}" data-action="filter-next"><p class="label">Próximo vencimiento</p><p class="value">${nextDays !== null ? nextDays + ' días' : '—'}</p></button>
      <button type="button" class="summary-box ${sf('active')}" data-action="filter-active"><p class="label">Ítems activos</p><p class="value">${state.items.length}</p></button>
      <button type="button" class="summary-box ${sf('overdue')}" data-action="filter-overdue"><p class="label">Ítems vencidos</p><p class="value">${overdueItems.length}</p></button>
    </div>

    <div class="tabs">
      <button class="${!state.summaryFilter && state.activeTab==='proximos'?'active':''}" data-action="tab-proximos">Próximos</button>
      <button class="${!state.summaryFilter && state.activeTab==='todo'?'active':''}" data-action="tab-todo">Ver todo</button>
    </div>

    <div class="list-header">
      <p>${listTitle}</p>
      <button class="btn-add" data-action="open-modal">+ Añadir</button>
    </div>

    <div class="item-list">
      ${list.length ? list.map(renderItemRow).join('') : `
        <div class="empty-state">
          <p>${emptyMsg}</p>
        </div>`}
    </div>

    ${footNote}
  </div>
  ${state.modalOpen ? renderModal() : ''}
  `;
}

function renderItemRow(item) {
  const u = urgency(item);
  const colors = {
    red: ['var(--danger-bg)','var(--danger-ink)'],
    orange: ['var(--orange-bg)','var(--orange-ink)'],
    yellow: ['var(--yellow-bg)','var(--yellow-ink)'],
    green: ['var(--green-bg)','var(--green-ink)'],
  };
  const [bg, ink] = colors[u.level];
  const chanIcons = (item.notify_whatsapp ? '💬' : '') + ' ' + (item.notify_mail ? '✉️' : '');
  return `
  <div class="item-row ${item.paid ? 'is-paid' : ''}">
    <div class="icon-badge" style="background:${bg};color:${ink};">${item.paid ? '✓' : '🔔'}</div>
    <div class="item-mid">
      <p class="name">${item.name}</p>
      <p class="meta">${item.paid ? (item.amount ? fmtMoney(item.amount) + ' €, pagado' : 'Pagado') : (item.amount ? fmtMoney(item.amount) + ' €' : 'Sin monto cargado')}</p>
    </div>
    <div class="item-badge-col">
      ${!item.paid ? `<span class="badge" style="background:${bg};color:${ink};">${u.label}</span>` : ''}
      <p class="date-sub">${fmtDate(u.due)}</p>
    </div>
    <div class="chan-icons">${chanIcons}</div>
    ${!item.paid
      ? `<button class="mark-paid-btn" data-action="mark-paid" data-id="${item.id}">Pagado</button>`
      : `<button class="mark-paid-btn is-done" data-action="undo-paid" data-id="${item.id}">Al día</button>`}
    <button class="icon-action-btn" data-action="open-edit-modal" data-id="${item.id}" title="Editar" aria-label="Editar">✏️</button>
    <button class="icon-action-btn" data-action="delete-item" data-id="${item.id}" title="Eliminar" aria-label="Eliminar">🗑️</button>
  </div>`;
}

function renderModal() {
  const it = state.editingItem;
  const isEdit = !!it;
  const nameVal = isEdit ? it.name : '';
  const amountVal = isEdit && it.amount != null ? String(it.amount).replace('.', ',') : '';
  const dateVal = isEdit ? it.due_date : toDateStr(addDays(today,7));
  const recurrenceVal = isEdit ? it.recurrence : 'mes';
  const waChecked = isEdit ? it.notify_whatsapp : true;
  const mailChecked = isEdit ? it.notify_mail : true;
  return `
  <div class="modal-backdrop" data-action="close-modal">
    <div class="modal-box" onclick="event.stopPropagation()">
      <p class="modal-title">${isEdit ? 'Editar' : 'Añadir nuevo'}</p>
      <div class="field"><label class="field-label">Nombre</label><input id="new-name" type="text" placeholder="Spotify, alquiler, IVA..." value="${nameVal.replace(/"/g,'&quot;')}"></div>
      <div class="row2">
        <div class="field"><label class="field-label">Importe (opcional)</label><input id="new-amount" type="text" placeholder="9,99" value="${amountVal}"></div>
        <div class="field"><label class="field-label">Fecha</label><input id="new-date" type="date" value="${dateVal}"></div>
      </div>
      <div class="field">
        <label class="field-label">Se repite</label>
        <select id="new-recurrence">
          <option value="no" ${recurrenceVal==='no'?'selected':''}>No se repite</option>
          <option value="mes" ${recurrenceVal==='mes'?'selected':''}>Cada mes</option>
          <option value="trimestre" ${recurrenceVal==='trimestre'?'selected':''}>Cada trimestre</option>
          <option value="anio" ${recurrenceVal==='anio'?'selected':''}>Cada año</option>
        </select>
      </div>
      <label class="chan-option"><input type="checkbox" id="new-chk-wa" ${waChecked?'checked':''}> WhatsApp</label>
      <label class="chan-option"><input type="checkbox" id="new-chk-mail" ${mailChecked?'checked':''}> Mail</label>
      <div style="margin-top:14px;">
        <button class="btn-primary" data-action="save-item" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Guardando…' : (isEdit ? 'Guardar cambios' : 'Guardar')}</button>
      </div>
    </div>
  </div>`;
}

function attachHandlers() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', async (e) => {
      const action = el.getAttribute('data-action');

      if (action === 'go-plan') { state.screen = 'plan'; render(); }
      else if (action === 'go-auth') { state.screen = 'auth'; render(); }
      else if (action === 'auth-mode-signup') { state.authMode = 'signup'; state.authError=''; state.confirmMsg=''; render(); }
      else if (action === 'auth-mode-signin') { state.authMode = 'signin'; state.authError=''; state.confirmMsg=''; render(); }
      else if (action === 'tab-proximos') { state.activeTab = 'proximos'; state.summaryFilter = null; render(); }
      else if (action === 'tab-todo') { state.activeTab = 'todo'; state.summaryFilter = null; render(); }
      else if (action === 'filter-paid') { state.summaryFilter = state.summaryFilter === 'paid' ? null : 'paid'; render(); }
      else if (action === 'filter-next') { state.summaryFilter = state.summaryFilter === 'next' ? null : 'next'; render(); }
      else if (action === 'filter-active') { state.summaryFilter = state.summaryFilter === 'active' ? null : 'active'; render(); }
      else if (action === 'filter-overdue') { state.summaryFilter = state.summaryFilter === 'overdue' ? null : 'overdue'; render(); }
      else if (action === 'open-modal') { state.modalOpen = true; state.editingItem = null; render(); }
      else if (action === 'open-edit-modal') {
        const id = el.getAttribute('data-id');
        state.editingItem = state.items.find(i => String(i.id) === String(id)) || null;
        state.modalOpen = true; render();
      }
      else if (action === 'close-modal') { state.modalOpen = false; state.editingItem = null; render(); }
      else if (action === 'delete-item') {
        const id = el.getAttribute('data-id');
        if (!confirm('¿Eliminar este ítem? No se puede deshacer.')) return;
        const { error } = await sb.from('items').delete().eq('id', id);
        if (error) { showToast('No se pudo eliminar: ' + error.message); return; }
        await loadItems();
      }
      else if (action === 'go-profile') {
        state.screen = 'profile'; state.profileMsg = ''; state.profileError = ''; render();
        await loadProfile();
      }
      else if (action === 'go-app-from-profile') {
        state.screen = 'app'; render();
      }
      else if (action === 'save-profile') {
        const phone = document.getElementById('profile-phone').value.trim();
        const avatar_url = document.getElementById('profile-avatar').value.trim();
        state.busy = true; state.profileMsg = ''; state.profileError = ''; render();
        const { error } = await sb.from('profiles').upsert({
          id: state.session.user.id, phone: phone || null, avatar_url: avatar_url || null
        });
        state.busy = false;
        if (error) { state.profileError = 'No se pudo guardar: ' + error.message; render(); return; }
        state.profile = { phone, avatar_url };
        state.profileMsg = 'Listo, guardado.';
        render();
      }
      else if (action === 'update-password') {
        const p1 = document.getElementById('profile-new-password').value;
        const p2 = document.getElementById('profile-new-password-2').value;
        state.profileMsg = ''; state.profileError = '';
        if (!p1 || !p2) { state.profileError = 'Completá los dos campos de contraseña.'; render(); return; }
        if (p1 !== p2) { state.profileError = 'Las contraseñas no coinciden.'; render(); return; }
        state.busy = true; render();
        const { error } = await sb.auth.updateUser({ password: p1 });
        state.busy = false;
        if (error) { state.profileError = 'No se pudo actualizar: ' + error.message; render(); return; }
        state.profileMsg = 'Contraseña actualizada.';
        render();
      }
      else if (action === 'sign-out') {
        await sb.auth.signOut();
        state.session = null; state.items = []; state.screen = 'plan'; render();
      }
      else if (action === 'do-signup') {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        if (!email || !password) { state.authError = 'Completa email y contraseña.'; render(); return; }
        state.busy = true; state.authError = ''; render();
        const { data, error } = await sb.auth.signUp({ email, password });
        state.busy = false;
        if (error) { state.authError = error.message; render(); return; }
        if (data.session) {
          state.session = data.session; state.screen = 'channels'; render();
        } else {
          state.confirmMsg = 'Te mandamos un mail de confirmación. Confirmalo y después iniciá sesión desde acá.';
          state.authMode = 'signin'; render();
        }
      }
      else if (action === 'do-signin') {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        if (!email || !password) { state.authError = 'Completa email y contraseña.'; render(); return; }
        state.busy = true; state.authError = ''; render();
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        state.busy = false;
        if (error) { state.authError = error.message; render(); return; }
        state.session = data.session; state.screen = 'app'; render();
        await loadItems();
      }
      else if (action === 'save-channels') {
        const phone = document.getElementById('channels-phone').value.trim();
        state.busy = true; render();
        const { error } = await sb.from('profiles').upsert({ id: state.session.user.id, phone: phone || null });
        state.busy = false;
        if (error) { showToast('No se pudo guardar el teléfono: ' + error.message); }
        state.screen = 'app'; render();
        await loadItems();
      }
      else if (action === 'mark-paid') {
        const id = el.getAttribute('data-id');
        const { error } = await sb.from('items').update({ paid: true, paid_on: toDateStr(today) }).eq('id', id);
        if (error) { showToast('No se pudo actualizar: ' + error.message); return; }
        await loadItems();
      }
      else if (action === 'undo-paid') {
        const id = el.getAttribute('data-id');
        const { error } = await sb.from('items').update({ paid: false, paid_on: null }).eq('id', id);
        if (error) { showToast('No se pudo actualizar: ' + error.message); return; }
        await loadItems();
      }
      else if (action === 'save-item') {
        const name = document.getElementById('new-name').value.trim();
        if (!name) return;
        const amountRaw = document.getElementById('new-amount').value.replace(',', '.');
        const amount = amountRaw ? parseFloat(amountRaw) : null;
        const dateVal = document.getElementById('new-date').value || toDateStr(addDays(today, 7));
        const recurrence = document.getElementById('new-recurrence').value;
        const notify_whatsapp = document.getElementById('new-chk-wa').checked;
        const notify_mail = document.getElementById('new-chk-mail').checked;
        state.busy = true; render();
        let error;
        if (state.editingItem) {
          ({ error } = await sb.from('items').update({
            name, amount, due_date: dateVal, recurrence, notify_whatsapp, notify_mail
          }).eq('id', state.editingItem.id));
        } else {
          ({ error } = await sb.from('items').insert({
            user_id: state.session.user.id, name, amount, due_date: dateVal, recurrence, notify_whatsapp, notify_mail
          }));
        }
        state.busy = false;
        if (error) { showToast('No se pudo guardar: ' + error.message); state.modalOpen = false; state.editingItem = null; render(); return; }
        state.modalOpen = false; state.editingItem = null;
        await loadItems();
      }
    });
  });
}

init();
</script>
</body>
</html>
